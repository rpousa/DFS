# Docker Compose for Edge Machine
# Deploy on PC: 192.168.1.221
# Components: CU-UP_e + UPF_e + ext_dn_e + DU_e1 + DU_e2 + UE_1

services:
  # ==========================================
  # UPF Edge — Slice 3 (SST=3, SD=1)
  # ==========================================

  upf_e:
    image: upf_1:comnetsemu
    container_name: upf_e
    hostname: upf_e
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.81.154
        priority: 1000
        interface_name: eth0
      ext_net:
        ipv4_address: 192.168.82.154
        priority: 900
        interface_name: eth1
    ports:
      - "192.168.1.221:8085:8085/tcp"
      - "192.168.1.221:8805:8805/udp"
      - "192.168.1.221:2152:2152/udp"       # GTP-U N3 (from CU-UP_e)
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./configs/upf_e/upf_e_config.yaml:/openair-upf/etc/config.yaml
      - ./logs/upf_e:/openair-upf/logs
    depends_on:
      - cuup_e
    environment:
      - ETH0_IP=192.168.81.154
      - ETH1_IP=192.168.82.154
    cpuset: "25-27"
    cpus: 3.0
    cpu_shares: 2048
    oom_score_adj: -500
    ulimits:
      rtprio: 99
      memlock: -1
      nofile: 1048576
    # sysctls:
    #   - net.core.rmem_max=33554432
    #   - net.core.wmem_max=33554432  
    entrypoint: [""]
    command: >
      sh -c "sysctl -w net.ipv4.ip_forward=1 &&
             sleep 2 &&
             /openair-upf/bin/oai_upf -c /openair-upf/etc/config.yaml -o"

  ext_dn_e:
    image: ext_dn:comnetsemu
    container_name: ext_dn_e
    hostname: ext_dn_e
    cap_add:
      - SYS_NICE
      - NET_ADMIN
    networks:
      ext_net:
        ipv4_address: 192.168.82.135
        interface_name: eth0
      sgi_net:
        ipv4_address: 172.28.2.9
        interface_name: eth1
    environment:
      - EBPF_GW_SETUP=no
      - EBPF_GW_N6_IP_ADDR=192.168.82.135
      - N6_IF_NAME=eth0
      - SGI_IF_NAME=eth2
      - GW_SGI_IP_ADDR=172.28.2.9
      - N3_IF_NAME=eth1
      - GW_N3_IP_ADDR=192.168.82.135
      - UE_IP_ADDRESS_POOL_1=12.1.1.0/24
      - UE_IP_ADDRESS_POOL_2=13.1.1.0/24
      - UE_IP_ADDRESS_POOL_3=14.1.1.0/24
      - SGI_DEMO_OAI_ADDR=172.28.2.1
      - N6_UPF_IP_ADDR=192.168.82.154
    #entrypoint: ["/bin/bash","-c","sleep infinity"]
        #      "iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE;"\
        #      "ip route add 12.1.1.0/24 via 192.168.82.154 dev eth0;"\
        #      "ip route add 13.1.1.0/24 via 192.168.82.154 dev eth0;"\
        #      "ip route add 14.1.1.0/24 via 192.168.82.154 dev eth0; sleep infinity"
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./configs/ext_dn:/tmp
    depends_on:
      - upf_e
    cpuset: "22-24"
    cpus: 3.0
    cpu_shares: 512
    command: 
      - /bin/bash
      - -c
      - |
        set -ex
        update-alternatives --set iptables  /usr/sbin/iptables-nft  || true
        update-alternatives --set ip6tables /usr/sbin/ip6tables-nft || true
        iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
        ip route add 12.1.1.0/24 via 192.168.82.154 dev eth0 || true
        ip route add 13.1.1.0/24 via 192.168.82.154 dev eth0 || true
        ip route add 14.1.1.0/24 via 192.168.82.154 dev eth0 || true
        /tmp/trfgen_entrypoint.sh 
        iperf3 -s -D -p 5201
        iperf3 -s -D -p 5202
        iperf3 -s -D -p 5203
        sleep infinity
    healthcheck:
      test: /bin/bash -c "ping -c 2 192.168.82.154"
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Edge CU-UP (gNB_CU_UP_ID=0xe02)
  # Serves: DU_e2 (local)
  # E1 → CU-CP @ Core (192.168.1.210:38462)
  # ==========================================

  cuup_e:
    image: cuup:comnetsemu
    container_name: cuup_e
    hostname: cuup_e
    cap_add:
      - SYS_NICE
      - NET_ADMIN
    networks:
      core_net:
        ipv4_address: 192.168.81.140
        priority: 900
        interface_name: eth0
      #f1u_net:
      #  ipv4_address: 192.168.84.140
      #  priority: 800
      #  interface_name: eth1
    ports:
      - "192.168.1.221:2153:2153/udp"       # GTP-U F1-U (inbound from DU_e2 local)
      - "192.168.1.221:2154:2152/udp"       # GTP-U N3 (towards UPF_e)
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./configs/cuup_e/gnb-cuup-edge.sa.f1.conf:/opt/oai-gnb/etc/gnb.conf
      - ./logs/cuup_e:/opt/oai-gnb/logs
    environment:
      USE_ADDITIONAL_OPTIONS: >-
        -E --sa 
        --log_config.global_log_options level,nocolor,time
        --log_config.global_log_level info
        --log_config.e1ap_log_level info
        --log_config.f1u_log_level info
        --log_config.gtpu_log_level info
        --log_config.asn1_log_level info
        --log_config.gnb_app_log_level info
        --log_config.util_log_level info
        --log_config.itti_log_level info
        --log_config.sctp_log_level info
        --e2_agent.near_ric_ip_addr 192.168.1.210
        --e2_agent.sm_dir /usr/local/lib/flexric/
        --telnetsrv --telnetsrv.shrmod ci,rrc
        --gNBs.[0].gNB_ID 0xe00
        --gNBs.[0].gNB_CU_UP_ID 0xe02
        --gNBs.[0].E1_INTERFACE.[0].type up
        --gNBs.[0].E1_INTERFACE.[0].ipv4_cucp 192.168.1.210
        --gNBs.[0].E1_INTERFACE.[0].ipv4_cuup 192.168.81.140
        --gNBs.[0].tr_s_preference f1
        --gNBs.[0].local_s_portd 2153
        --gNBs.[0].local_s_address 192.168.81.140
        --gNBs.[0].remote_s_address 0.0.0.0
        --gNBs.[0].NETWORK_INTERFACES.GNB_IPV4_ADDRESS_FOR_NG_AMF 192.168.81.140/26
        --gNBs.[0].NETWORK_INTERFACES.GNB_IPV4_ADDRESS_FOR_NGU 192.168.81.140/26
    #    --gNBs.[0].NETWORK_INTERFACES.GNB_PORT_FOR_NGU 2155
    cpuset: "21"
    cpus: 1.0
    cpu_shares: 4096
    oom_score_adj: -600
    ulimits:
      rtprio: 99
      memlock: -1
      nofile: 1048576
    # sysctls:
    #   - net.core.rmem_max=33554432
    #   - net.core.wmem_max=33554432
    command: >
      sh -c "sleep 20 &&
             /tini -sv -- /opt/oai-gnb/bin/entrypoint.sh /opt/oai-gnb/bin/nr-cuup -O /opt/oai-gnb/etc/gnb.conf 2>&1 |
             stdbuf -oL tee /opt/oai-gnb/logs/cuup_e_stdout.log"

  # ==========================================
  # DU_e1 (CellID=22222222, PCI=1)
  # F1-C → CU-CP @ Core (192.168.1.210:38472)
  # F1-U → CU-UP_co @ Centraloffice (192.168.1.219:2153) CROSS-MACHINE
  # ==========================================

  du_e1:
    image: du:comnetsemu
    container_name: du_e1
    hostname: du_e1
    cap_add:
      - NET_ADMIN
      - SYS_NICE
      - IPC_LOCK
    networks:
      f1c_net:
        ipv4_address: 192.168.83.151
      ran_net:
        ipv4_address: 192.168.80.151
      core_net:
        ipv4_address: 192.168.81.151
      usrp_sfp0:
        ipv4_address: ${EDGE_DU_SFP0_IP:-192.168.10.10}
      usrp_sfp1:
        ipv4_address: ${EDGE_DU_SFP1_IP:-192.168.20.10}
      #f1u_net:
      #  ipv4_address: 192.168.84.151
    ports:
      - "192.168.1.221:500:500/sctp"         # F1-C local SCTP port
      - "192.168.1.221:2162:2152/udp"        # F1-U local GTP-U port
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./configs/du_e1/gnb-du.sa.band78.273prb.usrp.yaml:/opt/oai-gnb/etc/gnb.yaml
      - ./logs/du_e1:/opt/oai-gnb/logs
      # vrtsim: the DU publishes its connection socket here; UEs read it.
      # The IQ samples themselves go through shared memory (ipc: host).
    #  - cirdb_data:/cirdb:ro      # CIR database
    environment:
      USE_ADDITIONAL_OPTIONS: >-
        --e2_agent.near_ric_ip_addr 192.168.1.210
        --e2_agent.sm_dir /usr/local/lib/flexric/
        --telnetsrv --telnetsrv.shrmod ci,rrc
        --Active_gNBs gNB-OAI
        --gNBs.[0].gNB_ID 0xe00
        --gNBs.[0].gNB_DU_ID 0xe03
        --gNBs.[0].gNB_name gNB-OAI
        --gNBs.[0].nr_cellid 22222222
        --gNBs.[0].servingCellConfigCommon.[0].physCellId 1
        --MACRLCs.[0].local_n_address 192.168.83.151
        --MACRLCs.[0].remote_n_address 192.168.1.210
        --MACRLCs.[0].remote_n_portd 2153                     
        --MACRLCs.[0].tr_s_preference local_L1
        --MACRLCs.[0].tr_n_preference f1
        --MACRLCs.[0].stats_max_ue 32
        --gNBs.[0].TIMERS.t300 1000
        --MACRLCs.[0].local_n_address_f1u 192.168.81.151
        --MACRLCs.[0].local_n_portd 2152
        --RUs.[0].sdr_addrs ${EDGE_SDR_ARGS:-addr=192.168.10.2,second_addr=192.168.20.2,clock_source=internal,time_source=internal}
        --RUs.[0].att_tx ${EDGE_ATT_TX:-0}
        --RUs.[0].att_rx ${EDGE_ATT_RX:-0}
        --RUs.[0].max_rxgain ${EDGE_MAX_RXGAIN:-75}
        --L1s.[0].max_ldpc_iterations 4
        --MACRLCs.[0].ulsch_max_frame_inactivity 0
        --gNBs.[0].min_rxtxtime 8
        --L1s.[0].L1_rx_thread_core 4
        --thread-pool ${EDGE_DU_THREAD_POOL:-5,6,7,8,9,10,11,12}
        --L1s.[0].L1_tx_thread_core 3
        ${EDGE_DU_EXTRA_OPTS:-}
# vrtsim (role server, num_ues 3, per-UE antennas) is set in the DU yaml's
# vrtsim: section. min_rxtxtime 8 as in OAI's 5g_vrtsim_multiue; needs the
# larger shm ring (OAI_EWOC c2726aacd8, 25 ms at 122.88 Msps) in both the DU
# and UE images. With the stock 614400-sample ring use 6.
# max_ldpc_iterations 2 -> 4: UL BLER was 12-14% at 256QAM MCS 27.
# No -E: at 273 PRB, 3/4 sampling of a 4096 FFT (3072) is too small for 3276
# subcarriers, so OAI doubles it to 6144 / 184.32 Msps (nr_parms.c
# set_scs_parameters), 1.5x MORE samples than plain 4096 / 122.88 Msps.
# It also overflowed vrtsim's shared-memory ring (614400 samples = 3.3 ms at
# 184.32 Msps): the DU writes min_rxtxtime (8 slots = 4 ms) ahead, so every
# DL write was rejected as too early and the UEs never found the SSB.
# (Most likely cause; the vrtsim exit counters would confirm it.)
# vrtsim.timescale: the shared-memory clock runs at timescale x wall clock
# (vrtsim.c timing thread), so wall-clock throughput is at most timescale x
# what the cell carries. At 0.2 one UE plateaued at ~100-118 Mbit/s with the
# DU at 70% CPU and the UE at 34%; 0.5 should allow ~2.5x. If the DU or UE
# can't keep up, Frame.Slot lines drift beyond 1.28 s / timescale apart and
# UEs lose sync: step back down.
# 0.5 kept Frame.Slot on time and CPU low on average, but under ~150 Mbit/s DL
# the UE's PUCCH/PUSCH went missing (pucch0_DTX, ulsch_DTX, UL BLER ~1,
# "Unexpected ULSCH HARQ PID"), DL MCS collapsed to Qm 2 and the UE re-attached
# with new RNTIs: UL slots sent too late for the per-slot deadline. 0.3 plus
# ue_0 on all 12 UE cores (ue_1/ue_2 are off).
# rfsim (previous setup, with the single 3-UE ue_1 below):
#        -E --rfsim --L1s.[0].max_ldpc_iterations 2 --gNBs.[0].min_rxtxtime 6
#        --rfsimulator.[0].serveraddr server
#        --rfsimulator.[0].serverport 4043
#         --MACRLCs.[0].ul_max_mcs 6
#        --log_config.hw_log_level debug
#  --vrtsim.cirdb 1
# --log_config.phy_log_level debug
# --log_config.mac_log_level debug
#        
      #  -E --rfsim        
      #  --rfsimulator.[0].serveraddr server
      #  --rfsimulator.[0].serverport 4043
    #  --MACRLCs.[0].local_n_port_f1u 2156
    # --gNBs.[0].TIMERS.t301 2000
    # --gNBs.[0].TIMERS.t310 2000
    # --gNBs.[0].TIMERS.t311 30000
    # --gNBs.[0].TIMERS.t319 2000
    # --MACRLCs.[0].remote_n_address_f1u 192.168.1.219
    depends_on:
      cuup_e:
        condition: service_healthy
      # cir-generator:
      #   condition: service_completed_successfully
    cpuset: "${EDGE_DU_CPUSET:-3-20}"   # the UE has left this machine: its cores go to the DU
    cpus: ${EDGE_DU_CPUS:-18.0}
    cpu_shares: 8192            # absolute top priority — radio
    oom_score_adj: -700
    ulimits:
      rtprio: 99
      memlock: -1
      nofile: 1048576
    # sysctls:
    #   - net.core.rmem_max=33554432
    #   - net.core.wmem_max=33554432
    command: >
      sh -c "sleep 5 &&
             ip route replace default via 192.168.81.129 &&
             /tini -sv -- /opt/oai-gnb/bin/entrypoint.sh /opt/oai-gnb/bin/nr-softmodem 2>&1 "
#             stdbuf -oL tee /opt/oai-gnb/logs/du_e1_stdout.log"

  # ==========================================
  # UEs on DU_e1 over vrtsim (shared memory), one container per UE:
  # vrtsim gives each UE process one slot (--vrtsim.ue_id), so the 3 UEs
  # cannot share one process with --num-ues as they did over rfsim.
  #   ue_0  eMBB  SST 1  IMSI ...110  vrtsim slot 0
  #   ue_1  URLLC SST 2  IMSI ...214  vrtsim slot 1
  #   ue_2  mIoT  SST 3  IMSI ...318  vrtsim slot 2
  # 100 MHz (273 PRB), 2x2, 256QAM capabilities (uecap_ports2.xml).
  # The DU's vrtsim.ue_config must list one 2x2 entry per slot.
  #
  # Default now: ue_0 alone carries all three slices (PDU sessions 1-3:
  # oaitun_ue1 eMBB, oaitun_ue1p2 URLLC, oaitun_ue1p3 mIoT) and the DU has
  # one vrtsim slot. ue_1/ue_2 are in the "multi-ue" profile, so a plain
  # "docker compose up" skips them; start them only with num_ues 3 in the DU
  # yaml and --profile multi-ue.
  # ==========================================


  # ue_0 moved to the centraloffice (docker-compose-centraloffice.yml), on its own USRP.


networks:
  core_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.81.128/26
          gateway: 192.168.81.129
    driver_opts:
      com.docker.network.bridge.name: br-core

  ext_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.82.128/26
          gateway: 192.168.82.129
    driver_opts:
      com.docker.network.bridge.name: br-ext

  f1c_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.83.128/26
          gateway: 192.168.83.129
    driver_opts:
      com.docker.network.bridge.name: br-f1c

  # f1u_net:
  #   driver: bridge
  #   ipam:
  #     config:
  #       - subnet: 192.168.84.128/26
  #         gateway: 192.168.84.129
  #   driver_opts:
  #     com.docker.network.bridge.name: br-f1u

  ran_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.80.128/26
          gateway: 192.168.80.129
    driver_opts:
      com.docker.network.bridge.name: br-ran

  sgi_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.2.0/24
          gateway: 172.28.2.1
    driver_opts:
      com.docker.network.bridge.name: br-sgi

  # ---- USRP links (SFP+), one macvlan network per link, MTU 9000 on the parent.
  # The radio container gets its own address on each link, so UHD streams
  # straight to it (no NAT); the host keeps its own address there for probing.
  usrp_sfp0:
    driver: macvlan
    driver_opts:
      parent: ${EDGE_SFP0_IF:-eno10np0}
    ipam:
      config:
        - subnet: ${EDGE_SFP0_SUBNET:-192.168.10.0/24}
          gateway: ${EDGE_SFP0_GW:-192.168.10.254}

  usrp_sfp1:
    driver: macvlan
    driver_opts:
      parent: ${EDGE_SFP1_IF:-eno13np3}
    ipam:
      config:
        - subnet: ${EDGE_SFP1_SUBNET:-192.168.20.0/24}
          gateway: ${EDGE_SFP1_GW:-192.168.20.254}

# ==========================================
# Volumes
# ==========================================

volumes:
  vrtsim_ipc:   # vrtsim connection socket shared by du_e1 and ue_0..ue_2
