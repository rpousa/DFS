  #     - SGI_IF_NAME=eth0
  #     - N6_UPF_IP_ADDR=192.168.72.160
  #   volumes:
  #     - ./configs/ext_dn_1:/tmp
  #   depends_on:
  #     - upf_1
  #   command: >
  #     sh -c "ifconfig eth0 mtu 1460 &&
  #            sleep 5 &&
  #            /tmp/trfgen_entrypoint.sh"

  # ==========================================
  # RAN Components (CU-CP, CU-UP, DU)
  # ==========================================

  cucp:
    image: cucp:comnetsemu
    container_name: cucp
    hostname: cucp
    cap_add:
      - SYS_NICE
      - NET_ADMIN
    networks:
      core_net:
        ipv4_address: 192.168.71.140
      f1c_net:
        ipv4_address: 192.168.73.140
      e1_net:
        ipv4_address: 192.168.75.140

    volumes:
      - ./configs/cucp/gnb-cucp.sa.f1.conf:/opt/oai-gnb/etc/gnb.conf
      - ./logs/cucp:/opt/oai-gnb/logs
    environment:
      USE_ADDITIONAL_OPTIONS: >-
                               --e2_agent.near_ric_ip_addr 192.168.71.150 --e2_agent.sm_dir /usr/local/lib/flexric/ 
                               --telnetsrv --telnetsrv.shrmod ci -E --gNBs.[0].enable_sdap 1
                               --gNBs.[0].gNB_ID  0xe00 --gNBs.[0].E1_INTERFACE.[0].type cp
                               --gNBs.[0].E1_INTERFACE.[0].ipv4_cucp 192.168.75.140 
                               --gNBs.[0].tr_s_preference f1 
                               --gNBs.[0].amf_ip_address.[0].ipv4 192.168.71.132
                               --gNBs.[0].local_s_address 192.168.73.140 
                               --gNBs.[0].remote_s_address 0.0.0.0
                               --gNBs.[0].NETWORK_INTERFACES.GNB_IPV4_ADDRESS_FOR_NG_AMF 192.168.71.140/26
                               --gNBs.[0].NETWORK_INTERFACES.GNB_IPV4_ADDRESS_FOR_NGU 192.168.71.140/26  
 
    depends_on:
      - amf
    command: >
      sh -c "sleep 15 &&
             /tini -sv -- /opt/oai-gnb/bin/entrypoint.sh /opt/oai-gnb/bin/nr-softmodem"

  cuup:
    image: cuup:comnetsemu
    container_name: cuup
    hostname: cuup
    cap_add:
      - SYS_NICE
      - NET_ADMIN
    networks:
      core_net:
        ipv4_address: 192.168.71.143
      e1_net:
        ipv4_address: 192.168.75.143
      f1u_net:
        ipv4_address: 192.168.74.143
    volumes:
      - ./configs/cuup/gnb-cuup.sa.f1.conf:/opt/oai-gnb/etc/gnb.conf
      - ./logs/cuup:/opt/oai-gnb/logs
    environment:
      USE_ADDITIONAL_OPTIONS: >-
                               --e2_agent.near_ric_ip_addr 192.168.71.150 --e2_agent.sm_dir /usr/local/lib/flexric/ 
                               --telnetsrv --telnetsrv.shrmod ci
                               -E --sa --log_config.global_log_options level,nocolor,time
                               --gNBs.[0].gNB_ID  0xe00 --gNBs.[0].gNB_CU_UP_ID  0xe00
                               --gNBs.[0].E1_INTERFACE.[0].type up
                               --gNBs.[0].E1_INTERFACE.[0].ipv4_cucp 192.168.75.140
                               --gNBs.[0].E1_INTERFACE.[0].ipv4_cuup 192.168.75.143
                               --gNBs.[0].tr_s_preference f1 --gNBs.[0].local_s_portd 2153 
                               --gNBs.[0].local_s_address 192.168.74.143 --gNBs.[0].remote_s_address 0.0.0.0
                               --gNBs.[0].NETWORK_INTERFACES.GNB_IPV4_ADDRESS_FOR_NG_AMF 192.168.71.143/26
                               --gNBs.[0].NETWORK_INTERFACES.GNB_IPV4_ADDRESS_FOR_NGU 192.168.71.143/26
    depends_on:
      - cucp
      - upf
    command: >
      sh -c "sleep 20 &&
             /tini -sv -- /opt/oai-gnb/bin/entrypoint.sh /opt/oai-gnb/bin/nr-cuup -O /opt/oai-gnb/etc/gnb.conf"

  du_1:
    image: du:comnetsemu
    container_name: du_1
    hostname: du_1
    ulimits:
      memlock:
        soft: -1
        hard: -1
    cap_add:
      - SYS_NICE
      - NET_ADMIN
    networks:
      f1c_net:
        ipv4_address: 192.168.73.151
      f1u_net:
        ipv4_address: 192.168.74.151
      ran_net:
        ipv4_address: 192.168.80.151
    volumes:
      - ./configs/du_1/gnb-du.sa.band78.106prb.rfsim.conf:/opt/oai-gnb/etc/gnb.conf
      - ./logs/du_1:/opt/oai-gnb/logs
    environment:
      USE_ADDITIONAL_OPTIONS: >-
                                --e2_agent.near_ric_ip_addr 192.168.71.150 --e2_agent.sm_dir /usr/local/lib/flexric/ 
                                --telnetsrv --telnetsrv.shrmod ci
                                -E --rfsim --Active_gNBs gNB-OAI
                                --gNBs.[0].gNB_ID 0xe00 --gNBs.[0].gNB_DU_ID 0xe00 --gNBs.[0].gNB_name gNB-OAI
                                --gNBs.[0].nr_cellid 11111111 --gNBs.[0].min_rxtxtime 6
                                --gNBs.[0].servingCellConfigCommon.[0].physCellId 1
                                --MACRLCs.[0].local_n_address 192.168.73.151
                                --MACRLCs.[0].remote_n_address 192.168.73.140
                                --MACRLCs.[0].local_n_address_f1u 192.168.74.151
                                --MACRLCs.[0].remote_n_portd 2153
                                --rfsimulator.[0].serveraddr 192.168.80.170
    depends_on:
      - cucp
      - cuup
    command: >
      sh -c "sleep 25 &&
             /tini -sv -- /opt/oai-gnb/bin/entrypoint.sh /opt/oai-gnb/bin/nr-softmodem"

  # ==========================================
  # FlexRIC (Near-RT RIC)
  # ==========================================

  flexric:
    image: flexric_test:comnetsemu
    container_name: flexric
    hostname: flexric
    cap_add:
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.71.150
    volumes:
      - ./configs/flexric:/usr/local/etc/flexric
      - ./logs/flexric:/usr/local/logs
      - ./xapps:/usr/local/xapps
    depends_on:
      - amf
    command: >
      sh -c "sleep 30 &&
             /usr/local/bin/ric_watchdog.sh"

  # ==========================================
  # User Equipment (UE)
  # ==========================================

  ue_1:
    image: ue:comnetsemu
    container_name: ue_1
    hostname: ue_1
    ulimits:
      memlock:
        soft: -1
        hard: -1
    cap_add:
      - SYS_NICE
      - NET_ADMIN
      - NET_RAW
    networks:
      ran_net:
        ipv4_address: 192.168.80.170
    volumes:
      - ./ue_volumes/nrue.rfsim.conf:/opt/oai-nr-ue/etc/nr-ue.conf
      - ./ue_volumes/ue_entrypoint.sh:/opt/oai-nr-ue/bin/entrypoint.sh
    #  - ./ue_volumes/openair1:/opt/oai-nr-ue/openair1/
      - ./logs/ue_1:/opt/oai-nr-ue/logs
    environment:
      OPENAIR_DIR: /opt/oai-nr-ue
      NR_AWGN_RESULTS_DIR : /opt/oai-nr-ue/openair1/SIMULATION/NR_PHY/BLER_SIMULATIONS/AWGN/AWGN_RESULTS
      USE_ADDITIONAL_OPTIONS: --log_config.all_log_level info -E --rfsim -r 106 --numerology 1 -C 3619200000 --ssb 516 --rfsimulator.[0].serveraddr server --rfsimulator.[0].options chanmod
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      - flexric
    command: >
        sh -c "sleep 5 &&
            /tini -sv -- /opt/oai-nr-ue/bin/entrypoint.sh /opt/oai-nr-ue/bin/nr-uesoftmodem " 
    #   sh -c "
    #          /opt/oai-nr-ue/bin/nr-uesoftmodem --help"
      

  # ==========================================
