# Docker Compose for Centraloffice Machine
# Deploy on PC: 192.168.0.193
# Components: CU-UP_co + UPF_co + ext_dn_co + DU_co
#
# The 5G Core has moved to the Core Machine (192.168.0.200)
# CU-CP has moved to the Core Machine (192.168.0.200)

services:
  # ==========================================
  # CU-UP Centraloffice (gNB_CU_UP_ID=0xe01)
  # Serves: DU_co (local) + DU_e1 (edge, cross-machine)
  # ==========================================

  cuup_co:
    image: cuup:comnetsemu
    container_name: cuup_co
    hostname: cuup_co
    cap_add:
      - SYS_NICE
      - NET_ADMIN
    networks:
      core_net:
        ipv4_address: 192.168.61.140
      f1u_net:
        ipv4_address: 192.168.74.140
      n3_net:
        ipv4_address: 192.168.100.140
    ports:
      - "192.168.0.193:2153:2153/udp"       # GTP-U F1-U (inbound from DU_co local + DU_e1 cross-machine)
      - "192.168.0.193:2155:2152/udp"       # GTP-U N3 (towards UPF_co)
      - 
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./configs/cuup_co/gnb-cuup.sa.f1.conf:/opt/oai-gnb/etc/gnb.conf
      - ./logs/cuup_co:/opt/oai-gnb/logs
    environment:
      USE_ADDITIONAL_OPTIONS: >-
        -E --sa
        --log_config.global_log_options level,nocolor,time
        --log_config.global_log_level info
        --log_config.e1ap_log_level debug
        --log_config.f1u_log_level debug
        --log_config.gtpu_log_level debug
        --e2_agent.near_ric_ip_addr 192.168.0.200
        --e2_agent.sm_dir /usr/local/lib/flexric/
        --telnetsrv --telnetsrv.shrmod ci
        --gNBs.[0].gNB_ID 0xe00
        --gNBs.[0].gNB_CU_UP_ID 0xe01
        --gNBs.[0].E1_INTERFACE.[0].type up
        --gNBs.[0].E1_INTERFACE.[0].ipv4_cucp 192.168.0.200
        --gNBs.[0].E1_INTERFACE.[0].ipv4_cuup 192.168.61.140
        --gNBs.[0].tr_s_preference f1
        --gNBs.[0].local_s_portd 2153
        --gNBs.[0].local_s_address 192.168.74.140
        --gNBs.[0].remote_s_address 0.0.0.0
        --gNBs.[0].NETWORK_INTERFACES.GNB_IPV4_ADDRESS_FOR_NG_AMF 192.168.61.140/26
        --gNBs.[0].NETWORK_INTERFACES.GNB_IPV4_ADDRESS_FOR_NGU 192.168.100.140/26
    command: >
      sh -c "sleep 20 &&
             /tini -sv -- /opt/oai-gnb/bin/entrypoint.sh /opt/oai-gnb/bin/nr-cuup -O /opt/oai-gnb/etc/gnb.conf 2>&1 |
             stdbuf -oL tee /opt/oai-gnb/logs/cuup_co_stdout.log"

  # ==========================================
  # UPF Centraloffice — Slice 2 (SST=1, SD=2)
  # ==========================================

  upf_co:
    image: upf_1:comnetsemu
    container_name: upf_co
    hostname: upf_co
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.61.144
        priority: 1000
      ext_net:
        ipv4_address: 192.168.72.144
        priority: 900
      n3_net:
        ipv4_address: 192.168.100.144
        priority: 950
    ports:
      - "192.168.0.193:8085:8085/tcp"
      - "8805/udp"
      - "192.168.0.193:2152:2152/udp"       # GTP-U N3 (from CU-UP_co)
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./configs/upf_co:/openair-upf/etc
      - ./logs/upf_co:/openair-upf/logs
    depends_on:
      - cuup_co
    environment:
      - ETH0_IP=192.168.61.144
      - ETH1_IP=192.168.72.144
      - ETH2_IP=192.168.100.144   
    entrypoint: ["/openair-upf/etc/fix_interfaces.sh"]
    command: >
      sh -c "sysctl -w net.ipv4.ip_forward=1 &&
             sleep 2 &&
             /openair-upf/bin/oai_upf -c /openair-upf/etc/config.yaml -o"

  ext_dn_co:
    image: ext_dn:comnetsemu
    container_name: ext_dn_co
    hostname: ext_dn_co
    cap_add:
      - SYS_NICE
      - NET_ADMIN
    networks:
      ext_net:
        ipv4_address: 192.168.72.135
      sgi_net:
        ipv4_address: 172.18.1.9
      n3_net:
        ipv4_address: 192.168.100.135
    environment:
      - EBPF_GW_SETUP=yes
      - EBPF_GW_N6_IP_ADDR=192.168.72.135
      - N6_IF_NAME=eth0
      - SGI_IF_NAME=eth1
      - GW_SGI_IP_ADDR=172.18.1.9
      - N3_IF_NAME=eth1
      - GW_N3_IP_ADDR=192.168.100.135
      - UE_IP_ADDRESS_POOL_1=12.1.1.0/24
      - UE_IP_ADDRESS_POOL_2=13.1.1.0/24
      - UE_IP_ADDRESS_POOL_3=14.1.1.0/24
      - SGI_DEMO_OAI_ADDR=172.18.1.1
      - N6_UPF_IP_ADDR=192.168.72.144
    entrypoint: ["/bin/bash","-c"] 
            #  "iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE;"\
            #  "ip route add 12.1.1.0/24 via 192.168.72.144 dev eth0;"\
            #  "ip route add 13.1.1.0/24 via 192.168.72.144 dev eth0;"\
            #  "ip route add 14.1.1.0/24 via 192.168.72.144 dev eth0; sleep infinity"
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./configs/ext_dn:/tmp
    depends_on:
      - upf_co
    command: 
      - |
        set -ex
        /tmp/trfgen_entrypoint.sh 
        iperf3 -s -D -p 5201
        iperf3 -s -D -p 5202
        iperf3 -s -D -p 5203
        sleep infinity
    healthcheck:
      test: /bin/bash -c "ping -c 2 192.168.72.144"
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # DU Centraloffice (CellID=11111111, PCI=0)
  # F1-C → CU-CP @ Core (192.168.0.200:38472)
  # F1-U → CU-UP_co (local, 192.168.74.140:2153)
  # ==========================================

  du_co:
    image: du:comnetsemu
    container_name: du_co
    hostname: du_co
    cap_add:
      - SYS_NICE
      - NET_ADMIN
    networks:
      f1c_net:
        ipv4_address: 192.168.73.141
      f1u_net:
        ipv4_address: 192.168.74.141
      ran_net:
        ipv4_address: 192.168.80.10
      core_net:
        ipv4_address: 192.168.61.141
    ports:
      - "192.168.0.193:500:500/sctp"         # F1-C local SCTP port
      - "192.168.0.193:2156:2152/udp"        # F1-U local GTP-U port
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./configs/du_co/gnb-du.sa.band78.106prb.rfsim.conf:/opt/oai-gnb/etc/gnb.conf
      - ./logs/du_co:/opt/oai-gnb/logs
    environment:
      USE_ADDITIONAL_OPTIONS: >-
        --e2_agent.near_ric_ip_addr 192.168.0.200
        --e2_agent.sm_dir /usr/local/lib/flexric/
        --telnetsrv --telnetsrv.shrmod ci
        -E --rfsim --Active_gNBs gNB-OAI
        --gNBs.[0].gNB_ID 0xe00
        --gNBs.[0].gNB_DU_ID 0xe00
        --gNBs.[0].gNB_name gNB-OAI
        --gNBs.[0].nr_cellid 11111111
        --gNBs.[0].min_rxtxtime 6
        --gNBs.[0].servingCellConfigCommon.[0].physCellId 0
        --MACRLCs.[0].local_n_address 192.168.73.141
        --MACRLCs.[0].remote_n_address 192.168.0.200
        --MACRLCs.[0].remote_n_portd 2153
        --MACRLCs.[0].remote_n_portc 38472
        --MACRLCs.[0].tr_s_preference local_L1
        --MACRLCs.[0].tr_n_preference f1
        --MACRLCs.[0].stats_max_ue 11
        --gNBs.[0].TIMERS.t300 1000
        --rfsimulator.[0].serveraddr server
        --rfsimulator.[0].serverport 4043
        --log_config.phy_log_level info
        --log_config.mac_log_level info
#        --MACRLCs.[0].local_n_address_f1u 192.168.74.141
#        --MACRLCs.[0].remote_n_address_f1u 192.168.74.140
    depends_on:
      - cuup_co
    command: >
      sh -c "sleep 25 &&
             /tini -sv -- /opt/oai-gnb/bin/entrypoint.sh /opt/oai-gnb/bin/nr-softmodem 2>&1"
# stdbuf -oL tee /opt/oai-gnb/logs/du_co_stdout.log"


# ==========================================
# Networks Configuration
# ==========================================

networks:
  core_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.61.128/26
          gateway: 192.168.61.129
    driver_opts:
      com.docker.network.bridge.name: br-core

  ext_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.72.128/26
          gateway: 192.168.72.129
    driver_opts:
      com.docker.network.bridge.name: br-ext

  f1c_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.73.128/26
          gateway: 192.168.73.129
    driver_opts:
      com.docker.network.bridge.name: br-f1c

  f1u_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.74.128/26
          gateway: 192.168.74.129
    driver_opts:
      com.docker.network.bridge.name: br-f1u

  ran_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.80.0/26
          gateway: 192.168.80.1
    driver_opts:
      com.docker.network.bridge.name: br-ran

  n3_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.128/26
          gateway: 192.168.100.129
    driver_opts:
      com.docker.network.bridge.name: br-n3

  sgi_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.1.0/24
          gateway: 172.18.1.1
    driver_opts:
      com.docker.network.bridge.name: br-sgi
