version: '3.8'

# Docker Compose for Machine 1 (Core Network + Central RAN)
# Deploy on PC: 192.168.0.193
# Components: Core Network + CU-CP + CU-UP (primary)
# 
# IMPORTANT: All ports are bound to 192.168.0.193 for cross-machine access
# This allows Machine 2 (192.168.0.243) to connect to these services

services:
  # ==========================================
  # 5G Core Network Functions
  # ==========================================
  
  mysql:
    image: mysql:comnetsemu
    container_name: mysql
    hostname: mysql
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.71.131
    ports:
      - "192.168.0.193:3306:3306/tcp"     # MySQL (for external access if needed)
      - "192.168.0.193:33060:33060/tcp"     # MySQL (for external access if needed)

    environment:
      - MYSQL_ROOT_PASSWORD=linux
      - MYSQL_DATABASE=oai_db
    command: >
      sh -c "ip link set eth0 down &&
             ip link set eth0 name mysql-sw1 &&
             ip link set mysql-sw1 up &&
             mysqld -u test --initialize-insecure --init-file=/docker-entrypoint-initdb.d/oai_db.sql &&
             mysqld -u test"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  nrf:
    image: nrf:comnetsemu
    container_name: nrf
    hostname: nrf
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.71.130
    ports:
      - "192.168.0.193:8080:80/tcp"       # HTTP API (for Machine 2)
      - "192.168.0.193:9090:9090/tcp"     # HTTP/2 (for Machine 2)
    volumes:
      - ./configs/nrf:/openair-nrf/etc
      - ./logs/nrf:/openair-nrf/logs
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "ip link set eth0 down &&
             ip link set eth0 name nrf-sw1 &&
             ip link set nrf-sw1 up &&
             sleep 5 &&
             /openair-nrf/bin/oai_nrf -c /openair-nrf/etc/config.yaml -o"

  smf:
    image: smf:comnetsemu
    container_name: smf
    hostname: smf
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.71.133
    ports:
      - "192.168.0.193:9091:80/tcp"           # HTTP API (for Machine 2)
      - "192.168.0.193:9101:8080/tcp"           
      - "192.168.0.193:8805:8805"     # PFCP (CRITICAL for Machine 2 UPF)
    volumes:
      - ./configs/smf:/openair-smf/etc
      - ./logs/smf:/openair-smf/logs
    depends_on:
      - nrf
    command: >
      sh -c "ip link set eth0 down &&
             ip link set eth0 name smf-sw1 &&
             ip link set smf-sw1 up &&
             sleep 5 &&
             /openair-smf/bin/oai_smf -c /openair-smf/etc/config.yaml -o"

  pcf:
    image: pcf:comnetsemu
    container_name: pcf
    hostname: pcf
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.71.139
    ports:
      - "192.168.0.193:9092:80/tcp"       # HTTP API
      - "192.168.0.193:9102:9090/tcp"
    volumes:
      - ./configs/pcf:/openair-pcf/etc
      - ./logs/pcf:/openair-pcf/logs
    depends_on:
      - nrf
    command: >
      sh -c "ip link set eth0 down &&
             ip link set eth0 name pcf-sw1 &&
             ip link set pcf-sw1 up &&
             sleep 5 &&
             /openair-pcf/bin/oai_pcf -c /openair-pcf/etc/config.yaml -o"

  nssf:
    image: nssf:comnetsemu
    container_name: nssf
    hostname: nssf
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.71.135
    ports:
      - "192.168.0.193:9093:80/tcp"       # HTTP API
      - "192.168.0.193:9103:8080/tcp"       # HTTP API
    volumes:
      - ./configs/nssf:/openair-nssf/etc
      - ./logs/nssf:/openair-nssf/logs
    depends_on:
      - nrf
    command: >
      sh -c "ip link set eth0 down &&
             ip link set eth0 name nssf-sw1 &&
             ip link set nssf-sw1 up &&
             sleep 5 &&
             /openair-nssf/bin/oai_nssf -c /openair-nssf/etc/config.yaml -o"

  amf:
    image: amf:comnetsemu
    container_name: amf
    hostname: amf
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.71.132
    ports:
      - "192.168.0.193:9104:8080/tcp"       # NGAP/SCTP (CRITICAL for Machine 2 CU-CP)
      - "192.168.0.193:38412:38412"   
      - "192.168.0.193:9094:80/tcp"           # HTTP API
    volumes:
      - ./configs/amf:/openair-amf/etc
      - ./logs/amf:/openair-amf/logs
    depends_on:
      - nrf
      - smf
    command: >
      sh -c "ip link set eth0 down &&
             ip link set eth0 name amf-sw1 &&
             ip link set amf-sw1 up &&
             sleep 5 &&
             /openair-amf/bin/oai_amf -c /openair-amf/etc/config.yaml -o"

  udm:
    image: udm:comnetsemu
    container_name: udm
    hostname: udm
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.71.136
    ports:
      - "192.168.0.193:9095:80/tcp"       # HTTP API
      - "192.168.0.193:9105:8080/tcp"       # HTTP API

    volumes:
      - ./configs/udm:/openair-udm/etc
      - ./logs/udm:/openair-udm/logs
    depends_on:
      - nrf
    command: >
      sh -c "ip link set eth0 down &&
             ip link set eth0 name udm-sw1 &&
             ip link set udm-sw1 up &&
             sleep 5 &&
             /openair-udm/bin/oai_udm -c /openair-udm/etc/config.yaml -o"
  udr:
    image: udr:comnetsemu
    container_name: udr
    hostname: udr
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.71.137
    ports:
      - "192.168.0.193:9096:80/tcp"       # HTTP API
    volumes:
      - ./configs/udr:/openair-udr/etc
      - ./logs/udr:/openair-udr/logs
    depends_on:
      - nrf
    command: >
      sh -c "ip link set eth0 down &&
             ip link set eth0 name udr-sw1 &&
             ip link set udr-sw1 up &&
             sleep 5 &&
             /openair-udr/bin/oai_udr -c /openair-udr/etc/config.yaml -o"

  ausf:
    image: ausf:comnetsemu
    container_name: ausf
    hostname: ausf
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.71.138
    ports:
      - "192.168.0.193:9097:80/tcp"       # HTTP API
    volumes:
      - ./configs/ausf:/openair-ausf/etc
      - ./logs/ausf:/openair-ausf/logs
    depends_on:
      - nrf
    command: >
      sh -c "ip link set eth0 down &&
             ip link set eth0 name ausf-sw1 &&
             ip link set ausf-sw1 up &&
             sleep 5 &&
             /openair-ausf/bin/oai_ausf -c /openair-ausf/etc/config.yaml -o"

  # ==========================================
  # Primary User Plane Function
  # ==========================================

  upf:
    image: upf_1:comnetsemu
    container_name: upf
    hostname: upf
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.71.134
      ext_net:
        ipv4_address: 192.168.72.134
    ports:
      - "192.168.0.193:8086:8080/tcp"
      - "192.168.0.193:8806:8805/tcp"     
      - "192.168.0.193:8806:8805/udp"     # PFCP (different port to avoid conflict with SMF)
      - "192.168.0.193:2152:2152/udp"     # GTP-U N3 (CRITICAL for Machine 2 CU-UP)
      - "192.168.0.193:2152:2152/tcp"     # GTP-U N3 (CRITICAL for Machine 2 CU-UP)

    volumes:
      - ./configs/upf:/openair-upf/etc
      - ./logs/upf:/openair-upf/logs
    depends_on:
      - nrf
      - smf
    command: >
      sh -c "sleep 2 &&
             ip link set eth0 down &&
             ip link set eth0 name upf-core &&
             ip link set upf-core up &&
             ip link set eth1 down &&
             ip link set eth1 name upf-ext_dn &&
             ip link set upf-ext_dn up &&
             sysctl -w net.ipv4.ip_forward=1 &&
             sleep 2 &&
             /openair-upf/bin/oai_upf -c /openair-upf/etc/config.yaml -o"

  ext_dn:
    image: ext_dn:comnetsemu
    container_name: ext_dn
    hostname: ext_dn
    cap_add:
      - SYS_NICE
      - NET_ADMIN
    networks:
      ext_net:
        ipv4_address: 192.168.72.135
    environment:
      - EBPF_GW_SETUP=yes
      - EBPF_GW_N6_IP_ADDR=192.168.72.135
      - N6_IF_NAME=eth0
      - SGI_IF_NAME=eth0
      - GW_SGI_IP_ADDR=172.17.0.9
      - N3_IF_NAME=eth1
      - GW_N3_IP_ADDR=192.168.100.135
      - UE_IP_ADDRESS_POOL_1=12.1.1.0/24
      - UE_IP_ADDRESS_POOL_2=13.1.1.0/24
      - UE_IP_ADDRESS_POOL_3=14.1.1.0/24
      - SGI_DEMO_OAI_ADDR=172.17.0.1
      - N6_UPF_IP_ADDR=192.168.72.134
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./configs/ext_dn:/tmp
    depends_on:
      - upf
    command: >
      sh -c "ip link set eth0 down &&
             ip link set eth0 name ext_dn-upf &&
             ip link set ext_dn-upf up &&
             ifconfig ext_dn-upf mtu 1460 &&
             sleep 5 &&
             /tmp/trfgen_entrypoint.sh"

  # ==========================================
  # Central RAN - CU-CP
  # ==========================================

  cucp:
    image: cucp:comnetsemu
    container_name: cucp
    hostname: cucp
    cap_add:
      - SYS_NICE
      - NET_ADMIN
    networks:
      core_net:
        ipv4_address: 192.168.71.140
      e1_net:
        ipv4_address: 192.168.75.140
      f1c_net:
        ipv4_address: 192.168.73.140
    ports:
      - "192.168.0.193:38472:38472"       # F1-C/SCTP (CRITICAL for Machine 2 DU)
    #  - "192.168.0.193:38472:38472/udp"        # F1-C/UDP
    volumes:
      - ./configs/cucp/gnb-cucp.sa.f1.conf:/opt/oai-gnb/etc/gnb.conf
      - ./logs/cucp:/opt/oai-gnb/logs
    environment:
      USE_ADDITIONAL_OPTIONS: >-
                               --e2_agent.near_ric_ip_addr 192.168.71.150 --e2_agent.sm_dir /usr/local/lib/flexric/ 
                               --telnetsrv --telnetsrv.shrmod ci
                               -E --log_config.global_log_options level,nocolor,time
                               --gNBs.[0].gNB_ID  0xe00 
                               --gNBs.[0].gNB_name gNB-OAI
                               --gNBs.[0].nr_cellid 11111111 
                               --gNBs.[0].tr_s_preference f1
                               --gNBs.[0].local_s_address 192.168.73.140
                               --gNBs.[0].remote_s_address 192.168.73.151
                               --gNBs.[0].local_s_portc 501
                               --gNBs.[0].remote_s_portc 500
                               --gNBs.[0].local_s_portd 601
                               --gNBs.[0].remote_s_portd 600
                               --gNBs.[0].E1_INTERFACE.[0].type cp
                               --gNBs.[0].E1_INTERFACE.[0].ipv4_cucp 192.168.75.140
                               --gNBs.[0].NETWORK_INTERFACES.GNB_IPV4_ADDRESS_FOR_NG_AMF 192.168.71.140/26
                               --gNBs.[0].NETWORK_INTERFACES.GNB_IPV4_ADDRESS_FOR_NGU 192.168.71.140/26
                               --gNBs.[0].amf_ip_address.[0].ipv4 192.168.71.132
    depends_on:
      - amf
    command: >
      sh -c "sleep 15 &&
             /tini -sv -- /opt/oai-gnb/bin/entrypoint.sh /opt/oai-gnb/bin/nr-softmodem"

  # ==========================================
  # Central RAN - Primary CU-UP
  # ==========================================

  cuup:
    image: cuup:comnetsemu
    container_name: cuup
    hostname: cuup
    cap_add:
      - SYS_NICE
      - NET_ADMIN
    networks:
      core_net:
        ipv4_address: 192.168.71.143
      e1_net:
        ipv4_address: 192.168.75.143
      f1u_net:
        ipv4_address: 192.168.74.143
    ports:
      - "192.168.0.193:2153:2153/udp"     # GTP-U F1-U (CRITICAL for Machine 2 DU)
    volumes:
      - ./configs/cuup/gnb-cuup.sa.f1.conf:/opt/oai-gnb/etc/gnb.conf
      - ./logs/cuup:/opt/oai-gnb/logs
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      USE_ADDITIONAL_OPTIONS: >-
                               --e2_agent.near_ric_ip_addr 192.168.71.150 --e2_agent.sm_dir /usr/local/lib/flexric/ 
                               --telnetsrv --telnetsrv.shrmod ci
                               -E --sa --log_config.global_log_options level,nocolor,time
                               --gNBs.[0].gNB_ID  0xe00 --gNBs.[0].gNB_CU_UP_ID  0xe00
                               --gNBs.[0].E1_INTERFACE.[0].type up
                               --gNBs.[0].E1_INTERFACE.[0].ipv4_cucp 192.168.75.140
                               --gNBs.[0].E1_INTERFACE.[0].ipv4_cuup 192.168.75.143
                               --gNBs.[0].tr_s_preference f1 --gNBs.[0].local_s_portd 2153 
                               --gNBs.[0].local_s_address 192.168.74.143 --gNBs.[0].remote_s_address 0.0.0.0
                               --gNBs.[0].NETWORK_INTERFACES.GNB_IPV4_ADDRESS_FOR_NG_AMF 192.168.71.143/26
                               --gNBs.[0].NETWORK_INTERFACES.GNB_IPV4_ADDRESS_FOR_NGU 192.168.71.143/26
    depends_on:
      - cucp
      - upf
    command: >
      sh -c "sleep 20 &&
             /tini -sv -- /opt/oai-gnb/bin/entrypoint.sh /opt/oai-gnb/bin/nr-cuup -O /opt/oai-gnb/etc/gnb.conf"

# ==========================================
# Networks Configuration
# ==========================================

networks:
  core_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.71.128/26
          gateway: 192.168.71.129
    driver_opts:
      com.docker.network.bridge.name: br-core

  ext_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.72.128/26
          gateway: 192.168.72.129
    driver_opts:
      com.docker.network.bridge.name: br-ext

  f1c_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.73.128/26
          gateway: 192.168.73.129
    driver_opts:
      com.docker.network.bridge.name: br-f1c
  
  f1u_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.74.128/26
          gateway: 192.168.74.129
    driver_opts:
      com.docker.network.bridge.name: br-f1u

  e1_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.75.128/26
          gateway: 192.168.75.129
    driver_opts:
      com.docker.network.bridge.name: br-e1

# ==========================================
# Volumes
# ==========================================

volumes:
  mysql_data:
    driver: local