#version: '3.8'

# Docker Compose for Machine 1 (Core Network + Central RAN)
# Deploy on PC: 192.168.0.193
# Components: Core Network + CU-CP + CU-UP (primary)
# 
# IMPORTANT: All ports are bound to 192.168.0.193 for cross-machine access
# This allows Machine 2 (192.168.0.243) to connect to these services

services:
  # ==========================================
  # 5G Core Network Functions
  # ==========================================
  
  mysql:
    image: mysql:comnetsemu
    container_name: mysql
    hostname: mysql
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.71.131
    ports:
      - "192.168.0.193:3306:3306/tcp"     # MySQL (for external access if needed)
      - "192.168.0.193:33060:33060/tcp"     # MySQL (for external access if needed)
    volumes:
      - ./configs/mysql/oai_db.sql:/docker-entrypoint-initdb.d/oai_db.sql
    environment:
      - MYSQL_ROOT_PASSWORD=linux
      - MYSQL_DATABASE=oai_db
    command: >
      sh -c "rm -rf /var/lib/mysql/* &&
             mysqld -u test --initialize-insecure --init-file=/docker-entrypoint-initdb.d/oai_db.sql &&
             mysqld -u test "
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  nrf:
    image: nrf:comnetsemu
    container_name: nrf
    hostname: nrf
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.71.130
    ports:
      - "192.168.0.193:80:80/tcp"
      - "192.168.0.193:8080:8080/tcp"       # HTTP API (for Machine 2)
      - "192.168.0.193:9090:9090/tcp"     # HTTP/2 (for Machine 2)
    volumes:
      - ./configs/nrf:/openair-nrf/etc
      - ./logs/nrf:/openair-nrf/logs
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "sleep 5 &&
             /openair-nrf/bin/oai_nrf -c /openair-nrf/etc/config.yaml -o"

  smf:
    image: smf:comnetsemu
    container_name: smf
    hostname: smf
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.71.133
    ports:
      - "192.168.0.193:9091:80/tcp"           # HTTP API (for Machine 2)
      - "192.168.0.193:9101:8080/tcp"           
      - "192.168.0.193:8805:8805/udp"     # PFCP (CRITICAL for Machine 2 UPF)
    volumes:
      - ./configs/smf:/openair-smf/etc
      - ./logs/smf:/openair-smf/logs
    depends_on:
      - nrf
    command: >
      sh -c "sleep 5 &&
             /openair-smf/bin/oai_smf -c /openair-smf/etc/config.yaml -o"

  pcf:
    image: pcf:comnetsemu
    container_name: pcf
    hostname: pcf
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.71.139
    ports:
      - "192.168.0.193:9092:80/tcp"       # HTTP API
      - "192.168.0.193:9102:9090/tcp"
    volumes:
      - ./configs/pcf/config.yaml:/openair-pcf/etc/config.yaml
      - ./configs/pcf/policies:/openair-pcf/policies
      - ./logs/pcf:/openair-pcf/logs
    depends_on:
      - nrf
    command: >
      sh -c "sleep 5 &&
             /openair-pcf/bin/oai_pcf -c /openair-pcf/etc/config.yaml -o"

  nssf:
    image: nssf:comnetsemu
    container_name: nssf
    hostname: nssf
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.71.135
    ports:
      - "192.168.0.193:9093:80/tcp"       # HTTP API
      - "192.168.0.193:9103:8080/tcp"       # HTTP API
    volumes:
      - ./configs/nssf:/openair-nssf/etc
      - ./logs/nssf:/openair-nssf/logs
    depends_on:
      - nrf
    command: >
      sh -c "sleep 5 &&
             /openair-nssf/bin/oai_nssf -c /openair-nssf/etc/config.yaml -o"

  amf:
    image: amf:comnetsemu
    container_name: amf
    hostname: amf
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    #network_mode: host 
    networks:
     core_net:
       ipv4_address: 192.168.71.132
    ports:
     - "192.168.0.193:9104:8080/tcp"       # NGAP/SCTP (CRITICAL for Machine 2 CU-CP)
     - "192.168.0.193:38412:38412/sctp"   
     - "192.168.0.193:9094:80/tcp"           # HTTP API
    volumes:
      - ./configs/amf:/openair-amf/etc
      - ./logs/amf:/openair-amf/logs
    depends_on:
      - nrf
      - smf
    command: >
      sh -c "sleep 5 &&
             /openair-amf/bin/oai_amf -c /openair-amf/etc/config.yaml -o"

  udm:
    image: udm:comnetsemu
    container_name: udm
    hostname: udm
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.71.136
    ports:
      - "192.168.0.193:9095:80/tcp"       # HTTP API
      - "192.168.0.193:9105:8080/tcp"       # HTTP API

    volumes:
      - ./configs/udm:/openair-udm/etc
      - ./logs/udm:/openair-udm/logs
    depends_on:
      - nrf
    command: >
      sh -c "sleep 5 &&
             /openair-udm/bin/oai_udm -c /openair-udm/etc/config.yaml -o"
  udr:
    image: udr:comnetsemu
    container_name: udr
    hostname: udr
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.71.137
    ports:
      - "192.168.0.193:9096:80/tcp"       # HTTP API
    volumes:
      - ./configs/udr:/openair-udr/etc
      - ./logs/udr:/openair-udr/logs
    depends_on:
      - nrf
    command: >
      sh -c "sleep 5 &&
             /openair-udr/bin/oai_udr -c /openair-udr/etc/config.yaml -o"

  ausf:
    image: ausf:comnetsemu
    container_name: ausf
    hostname: ausf
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.71.138
    ports:
      - "192.168.0.193:9097:80/tcp"       # HTTP API
    volumes:
      - ./configs/ausf:/openair-ausf/etc
      - ./logs/ausf:/openair-ausf/logs
    depends_on:
      - nrf
    command: >
      sh -c "sleep 5 &&
             /openair-ausf/bin/oai_ausf -c /openair-ausf/etc/config.yaml -o"

  # ==========================================
  # Primary User Plane Function
  # ==========================================

  upf:
    image: upf_1:comnetsemu
    container_name: upf
    hostname: upf
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    #network_mode: host
    networks:
      core_net:
        ipv4_address: 192.168.71.134
        priority: 1000
      ext_net:
        ipv4_address: 192.168.72.134
        priority: 900
    ports:
      - "192.168.0.193:8085:8085/tcp"
      - "8805/udp"     # PFCP (different port to avoid conflict with SMF)
      - "192.168.0.193:2152:2152/udp"     # GTP-U N3 (CRITICAL for Machine 2 CU-UP)
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./configs/upf:/openair-upf/etc
      - ./logs/upf:/openair-upf/logs
    depends_on:
      - nrf
      - smf
    environment:
    - ETH0_IP=192.168.71.134    # core_net → eth0
    - ETH1_IP=192.168.72.134    # ext_net → eth1
    entrypoint: ["/openair-upf/etc/fix_interfaces.sh"]
    command: >
      sh -c "sysctl -w net.ipv4.ip_forward=1 &&
             sleep 2 &&
             /openair-upf/bin/oai_upf -c /openair-upf/etc/config.yaml -o"

  ext_dn:
    image: ext_dn:comnetsemu
    container_name: ext_dn
    hostname: ext_dn
    cap_add:
      - SYS_NICE
      - NET_ADMIN
    networks:
      ext_net:
        ipv4_address: 192.168.72.135
      n3_net:
        ipv4_address: 192.168.100.135
      sgi_net:
        ipv4_address: 172.18.0.9
    environment:
      - EBPF_GW_SETUP=yes
      - EBPF_GW_N6_IP_ADDR=192.168.72.135
      - N6_IF_NAME=eth0
      - SGI_IF_NAME=eth2
      - GW_SGI_IP_ADDR=172.18.0.9
      - N3_IF_NAME=eth1
      - GW_N3_IP_ADDR=192.168.100.135
      - UE_IP_ADDRESS_POOL_1=12.1.1.0
      - UE_IP_ADDRESS_POOL_2=13.1.1.0
      - UE_IP_ADDRESS_POOL_3=14.1.1.0
      - SGI_DEMO_OAI_ADDR=172.18.0.1
      - N6_UPF_IP_ADDR=192.168.72.134
    entrypoint: /bin/bash -c \
              "iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE;"\
              "ip route add 12.1.1.0/24 via 192.168.72.134 dev eth0;"\
              "ip route add 13.1.1.0/24 via 192.168.72.134 dev eth0;"\
              "ip route add 14.1.1.0/24 via 192.168.72.134 dev eth0; sleep infinity"
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./configs/ext_dn:/tmp
    depends_on:
      - upf
    command: >
      sh -c "sleep 5 &&
             /tmp/trfgen_entrypoint.sh &&
             sleep infinity"
    healthcheck:
      test: /bin/bash -c "ping -c 2 192.168.72.134"
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5
  # ==========================================
  # Central RAN - CU
  # ==========================================
  cu:
    image: cu:comnetsemu
    container_name: cu
    hostname: cu
    cap_add:
      - SYS_NICE
      - NET_ADMIN
    networks:
      core_net:
        ipv4_address: 192.168.71.140
    ports:
      - "192.168.0.193:38472:38472/sctp"       # F1-C/SCTP (CRITICAL for Machine 2 DU)
      - "192.168.0.193:2153:2153/udp" 
    volumes:
      - ./configs/cu/gnb-cu.sa.band78.106prb.conf:/opt/oai-gnb/etc/gnb.conf
      - ./logs/cu:/opt/oai-gnb/logs
    environment:
      USE_ADDITIONAL_OPTIONS: >-
                               --e2_agent.near_ric_ip_addr 192.168.71.150 --e2_agent.sm_dir /usr/local/lib/flexric/ 
                               --telnetsrv --telnetsrv.shrmod ci
                               -E --log_config.global_log_options level,nocolor,time
                               --gNBs.[0].gNB_ID  0xe00 
                               --gNBs.[0].gNB_name gNB-OAI
                               --gNBs.[0].nr_cellid 11111111 
                               --gNBs.[0].tr_s_preference f1
                               --gNBs.[0].local_s_address 192.168.71.140
                               --gNBs.[0].local_s_portd 2153 
                               --log_config.global_log_level debug
    depends_on:
      - amf
      - upf
    command: >
        sh -c "sleep 15 &&
              /tini -sv -- /opt/oai-gnb/bin/entrypoint.sh /opt/oai-gnb/bin/nr-softmodem"

 
# ==========================================
# Flexric Near Real-Time RIC
# ==========================================

  flexric:
    image: comnetsemu_flexric:comnetsemu
    container_name: flexric
    hostname: flexric
    cap_add:
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.71.150
    ports:
      - "192.168.0.193:36421:36421/sctp"      # F1-C local SCTP port
      - "192.168.0.193:36422:36422/sctp" 
    volumes:
      - ./configs/flexric:/usr/local/etc/flexric
      - ./logs/flexric:/usr/local/logs
      - ./flexric_volumes/event_ric_watchdog.sh:/usr/local/bin/ric_watchdog.sh
      - ./flexric_volumes/xapp_daemon.py:/usr/local/flexric/xApp/python3/xapp_daemon.py
      - ./flexric_volumes/topology.py:/usr/local/flexric/xApp/python3/topology.py
      - ./flexric_volumes/xapp_functs.py:/usr/local/flexric/xApp/python3/xapp_functs.py
      - ./flexric_volumes/xapp_test.py:/usr/local/flexric/xApp/python3/xapp.py
      #- ./flexric_volumes/event_ric_watchdog.sh:/usr/local/flexric/xApp/python3/event_ric_watchdog.sh
    depends_on:
      - mysql
    command: >
      sh -c "sleep 5 &&
             /usr/local/bin/ric_watchdog.sh"


# ==========================================
# Networks Configuration
# ==========================================

networks:
  core_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.71.128/26
          gateway: 192.168.71.129
    driver_opts:
      com.docker.network.bridge.name: br-core

  ext_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.72.128/26
          gateway: 192.168.72.129
    driver_opts:
      com.docker.network.bridge.name: br-ext
  
  n3_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.128/26
          gateway: 192.168.100.129
    driver_opts:
      com.docker.network.bridge.name: br-n3
  
  sgi_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
    driver_opts:
      com.docker.network.bridge.name: br-sgi

# ==========================================
# Volumes
# ==========================================

volumes:
  mysql_data:
    driver: local