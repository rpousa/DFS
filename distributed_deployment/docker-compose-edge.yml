# Docker Compose for Edge Machine
# Deploy on PC: 192.168.0.243
# Components: CU-UP_e + UPF_e + ext_dn_e + DU_e1 + DU_e2 + UE_1

services:

  # ==========================================
  # UPF Edge — Slice 3 (SST=1, SD=3)
  # ==========================================

  upf_e:
    image: upf_1:comnetsemu
    container_name: upf_e
    hostname: upf_e
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.81.154
        priority: 1000
        interface_name: eth0
      ext_net:
        ipv4_address: 192.168.82.154
        priority: 900
        interface_name: eth1
    ports:
      - "192.168.0.243:8085:8085/tcp"
      - "192.168.0.243:8805:8805/udp"
      - "192.168.0.243:2152:2152/udp"       # GTP-U N3 (from CU-UP_e)
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./configs/upf_e/upf_e_config.yaml:/openair-upf/etc/config.yaml
      - ./logs/upf_e:/openair-upf/logs
    depends_on:
      - cuup_e
    environment:
      - ETH0_IP=192.168.81.154
      - ETH1_IP=192.168.82.154  
    entrypoint: [""]
    command: >
      sh -c "sysctl -w net.ipv4.ip_forward=1 &&
             sleep 2 &&
             /openair-upf/bin/oai_upf -c /openair-upf/etc/config.yaml -o"

  ext_dn_e:
    image: ext_dn:comnetsemu
    container_name: ext_dn_e
    hostname: ext_dn_e
    cap_add:
      - SYS_NICE
      - NET_ADMIN
    networks:
      ext_net:
        ipv4_address: 192.168.82.135
        interface_name: eth0
      sgi_net:
        ipv4_address: 172.18.2.9
        interface_name: eth1
    environment:
      - EBPF_GW_SETUP=no
      - EBPF_GW_N6_IP_ADDR=192.168.82.135
      - N6_IF_NAME=eth0
      - SGI_IF_NAME=eth2
      - GW_SGI_IP_ADDR=172.18.2.9
      - N3_IF_NAME=eth1
      - GW_N3_IP_ADDR=192.168.82.135
      - UE_IP_ADDRESS_POOL_1=12.1.1.0/24
      - UE_IP_ADDRESS_POOL_2=13.1.1.0/24
      - UE_IP_ADDRESS_POOL_3=14.1.1.0/24
      - SGI_DEMO_OAI_ADDR=172.18.2.1
      - N6_UPF_IP_ADDR=192.168.82.154
    #entrypoint: ["/bin/bash","-c","sleep infinity"]
        #      "iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE;"\
        #      "ip route add 12.1.1.0/24 via 192.168.82.154 dev eth0;"\
        #      "ip route add 13.1.1.0/24 via 192.168.82.154 dev eth0;"\
        #      "ip route add 14.1.1.0/24 via 192.168.82.154 dev eth0; sleep infinity"
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./configs/ext_dn:/tmp
    depends_on:
      - upf_e
    command: 
      - /bin/bash
      - -c
      - |
        set -ex
        iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
        ip route add 12.1.1.0/24 via 192.168.82.154 dev eth0 || true
        ip route add 13.1.1.0/24 via 192.168.82.154 dev eth0 || true
        ip route add 14.1.1.0/24 via 192.168.82.154 dev eth0 || true
        /tmp/trfgen_entrypoint.sh 
        iperf3 -s -D -p 5201
        iperf3 -s -D -p 5202
        iperf3 -s -D -p 5203
        sleep infinity
    healthcheck:
      test: /bin/bash -c "ping -c 2 192.168.82.154"
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Edge CU-UP (gNB_CU_UP_ID=0xe02)
  # Serves: DU_e2 (local)
  # E1 → CU-CP @ Core (192.168.0.200:38462)
  # ==========================================

  cuup_e:
    image: cuup:comnetsemu
    container_name: cuup_e
    hostname: cuup_e
    cap_add:
      - SYS_NICE
      - NET_ADMIN
    networks:
      core_net:
        ipv4_address: 192.168.81.140
        priority: 900
        interface_name: eth0
      f1u_net:
        ipv4_address: 192.168.84.140
        priority: 800
        interface_name: eth1
    ports:
      - "192.168.0.243:2153:2153/udp"       # GTP-U F1-U (inbound from DU_e2 local)
      - "192.168.0.243:2155:2155/udp"       # GTP-U N3 (towards UPF_e)
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./configs/cuup_e/gnb-cuup-edge.sa.f1.conf:/opt/oai-gnb/etc/gnb.conf
      - ./logs/cuup_e:/opt/oai-gnb/logs
    environment:
      USE_ADDITIONAL_OPTIONS: >-
        -E --sa
        --log_config.global_log_options level,nocolor,time
        --log_config.global_log_level info
        --log_config.e1ap_log_level debug
        --log_config.f1u_log_level debug
        --log_config.gtpu_log_level debug
        --e2_agent.near_ric_ip_addr 192.168.0.200
        --e2_agent.sm_dir /usr/local/lib/flexric/
        --telnetsrv --telnetsrv.shrmod ci
        --gNBs.[0].gNB_ID 0xe00
        --gNBs.[0].gNB_CU_UP_ID 0xe02
        --gNBs.[0].E1_INTERFACE.[0].type up
        --gNBs.[0].E1_INTERFACE.[0].ipv4_cucp 192.168.0.200
        --gNBs.[0].E1_INTERFACE.[0].ipv4_cuup 192.168.81.140
        --gNBs.[0].tr_s_preference f1
        --gNBs.[0].local_s_portd 2153
        --gNBs.[0].local_s_address 192.168.84.140
        --gNBs.[0].remote_s_address 0.0.0.0
        --gNBs.[0].NETWORK_INTERFACES.GNB_IPV4_ADDRESS_FOR_NG_AMF 192.168.81.140/26
        --gNBs.[0].NETWORK_INTERFACES.GNB_IPV4_ADDRESS_FOR_NGU 192.168.81.140/26
        --gNBs.[0].NETWORK_INTERFACES.GNB_PORT_FOR_NGU 2155
    command: >
      sh -c "sleep 20 &&
             /tini -sv -- /opt/oai-gnb/bin/entrypoint.sh /opt/oai-gnb/bin/nr-cuup -O /opt/oai-gnb/etc/gnb.conf 2>&1 |
             stdbuf -oL tee /opt/oai-gnb/logs/cuup_e_stdout.log"

  # ==========================================
  # DU_e1 (CellID=22222222, PCI=1)
  # F1-C → CU-CP @ Core (192.168.0.200:38472)
  # F1-U → CU-UP_co @ Centraloffice (192.168.0.193:2153) CROSS-MACHINE
  # ==========================================

  du_e1:
    image: du:comnetsemu
    container_name: du_e1
    hostname: du_e1
    cap_add:
      - SYS_NICE
      - NET_ADMIN
    networks:
      f1c_net:
        ipv4_address: 192.168.83.151
      f1u_net:
        ipv4_address: 192.168.84.151
      ran_net:
        ipv4_address: 192.168.80.151
      core_net:
        ipv4_address: 192.168.81.151
    ports:
      - "192.168.0.243:500:500/sctp"         # F1-C local SCTP port
      - "192.168.0.243:2162:2156/udp"        # F1-U local GTP-U port
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./configs/du_e1/gnb-du.sa.band78.106prb.rfsim.conf:/opt/oai-gnb/etc/gnb.conf
      - ./logs/du_e1:/opt/oai-gnb/logs
    environment:
      USE_ADDITIONAL_OPTIONS: >-
        --e2_agent.near_ric_ip_addr 192.168.0.200
        --e2_agent.sm_dir /usr/local/lib/flexric/
        --telnetsrv --telnetsrv.shrmod ci
        -E --rfsim --Active_gNBs gNB-OAI
        --gNBs.[0].gNB_ID 0xe00
        --gNBs.[0].gNB_DU_ID 0xe01
        --gNBs.[0].gNB_name gNB-OAI
        --gNBs.[0].nr_cellid 22222222
        --gNBs.[0].min_rxtxtime 6
        --gNBs.[0].servingCellConfigCommon.[0].physCellId 1
        --MACRLCs.[0].local_n_address 192.168.83.151
        --MACRLCs.[0].remote_n_address 192.168.0.200
        --MACRLCs.[0].remote_n_portd 2153                     
        --MACRLCs.[0].remote_n_portc 38472
        --MACRLCs.[0].tr_s_preference local_L1
        --MACRLCs.[0].tr_n_preference f1
        --MACRLCs.[0].stats_max_ue 32
        --gNBs.[0].TIMERS.t300 1000       
        --rfsimulator.[0].serveraddr server
        --rfsimulator.[0].serverport 4043
        --log_config.phy_log_level info
        --log_config.mac_log_level info
        --MACRLCs.[0].local_n_address_f1u 192.168.84.151
        --MACRLCs.[0].local_n_portd 2152
      #  --MACRLCs.[0].local_n_port_f1u 2156
# --gNBs.[0].TIMERS.t301 2000
# --gNBs.[0].TIMERS.t310 2000
# --gNBs.[0].TIMERS.t311 30000
# --gNBs.[0].TIMERS.t319 2000
#        --MACRLCs.[0].remote_n_address_f1u 192.168.0.193
    depends_on:
      - cuup_e
    command: >
      sh -c "sleep 25 &&
             /tini -sv -- /opt/oai-gnb/bin/entrypoint.sh /opt/oai-gnb/bin/nr-softmodem 2>&1 "
#             stdbuf -oL tee /opt/oai-gnb/logs/du_e1_stdout.log"

  # ==========================================
  # DU_e2 (CellID=33333333, PCI=2)
  # F1-C → CU-CP @ Core (192.168.0.200:38472)
  # F1-U → CU-UP_e (local, 192.168.84.140:2153)
  # ==========================================

  du_e2:
    image: du:comnetsemu
    container_name: du_e2
    hostname: du_e2
    cap_add:
      - SYS_NICE
      - NET_ADMIN
    networks:
      f1c_net:
        ipv4_address: 192.168.83.161
      f1u_net:
        ipv4_address: 192.168.84.161
      ran_net:
        ipv4_address: 192.168.80.161
      core_net:
        ipv4_address: 192.168.81.161
    ports:
      - "192.168.0.243:501:501/sctp"         # F1-C local SCTP port (different from DU_e1)
      - "192.168.0.243:2163:2152/udp"        # F1-U local GTP-U port
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./configs/du_e2/gnb-du.sa.band78.106prb.rfsim.conf:/opt/oai-gnb/etc/gnb.conf
      - ./logs/du_e2:/opt/oai-gnb/logs
    environment:
      USE_ADDITIONAL_OPTIONS: >-
        --e2_agent.near_ric_ip_addr 192.168.0.200
        --e2_agent.sm_dir /usr/local/lib/flexric/
        --telnetsrv --telnetsrv.shrmod ci
        -E --rfsim --Active_gNBs gNB-OAI
        --gNBs.[0].gNB_ID 0xe00
        --gNBs.[0].gNB_DU_ID 0xe02
        --gNBs.[0].gNB_name gNB-OAI
        --gNBs.[0].nr_cellid 33333333
        --gNBs.[0].min_rxtxtime 6
        --gNBs.[0].servingCellConfigCommon.[0].physCellId 2
        --MACRLCs.[0].local_n_address 192.168.83.161
        --MACRLCs.[0].remote_n_address 192.168.0.200  
        --MACRLCs.[0].remote_n_portd 2153
        --MACRLCs.[0].remote_n_portc 38472
        --MACRLCs.[0].tr_s_preference local_L1
        --MACRLCs.[0].tr_n_preference f1
        --MACRLCs.[0].stats_max_ue 32
        --gNBs.[0].TIMERS.t300 1000
        --rfsimulator.[0].serveraddr server
        --rfsimulator.[0].serverport 4044
        --log_config.phy_log_level info
        --log_config.mac_log_level info
        --MACRLCs.[0].local_n_address_f1u 192.168.84.161
        --MACRLCs.[0].local_n_portd 2152       
#        --MACRLCs.[0].local_n_port_f1u 2157
# --gNBs.[0].TIMERS.t301 2000
# --gNBs.[0].TIMERS.t310 2000
# --gNBs.[0].TIMERS.t311 30000
# --gNBs.[0].TIMERS.t319 2000
#      --MACRLCs.[0].remote_n_address_f1u 192.168.84.140
    depends_on:
      - cuup_e
    command: >
      sh -c "sleep 25 &&
             /tini -sv -- /opt/oai-gnb/bin/entrypoint.sh /opt/oai-gnb/bin/nr-softmodem 2>&1"
  #           stdbuf -oL tee /opt/oai-gnb/logs/du_e2_stdout.log"

  # ==========================================
  # UE_1 — 10 UEs attached to DU_e1 (RFSimulator)
  # Per requirement: ALL UEs connect to DU_e1 (which uses CU-UP @ Centraloffice)
  # ==========================================

  ue_1:
    image: ue:comnetsemu
    container_name: ue_1
    hostname: ue_1
    cap_add:
      - SYS_NICE
      - NET_ADMIN
    privileged: true
    networks:
      ran_net:
        ipv4_address: 192.168.80.168
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./configs/ue_1/nrue.rfsim.conf:/opt/oai-nr-ue/etc/nr-ue.conf
      - ./logs/ue_1:/opt/oai-nr-ue/logs
    environment:
      USE_ADDITIONAL_OPTIONS: >-
        -E --rfsim --num-ues 4
        -r 106 --numerology 1 --band 78 -C 3619200000
        --ssb 516
        --log_config.global_log_options level,nocolor,time
        --log_config.global_log_level info
    depends_on:
      - du_e1
    command: >
      sh -c "sleep 45 &&
             /tini -sv -- /opt/oai-nr-ue/bin/entrypoint.sh /opt/oai-nr-ue/bin/nr-uesoftmodem 2>&1 "
 #            stdbuf -oL tee /opt/oai-nr-ue/logs/ue_1_stdout.log"

# ==========================================
# Networks Configuration
# ==========================================

networks:
  core_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.81.128/26
          gateway: 192.168.81.129
    driver_opts:
      com.docker.network.bridge.name: br-core

  ext_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.82.128/26
          gateway: 192.168.82.129
    driver_opts:
      com.docker.network.bridge.name: br-ext

  f1c_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.83.128/26
          gateway: 192.168.83.129
    driver_opts:
      com.docker.network.bridge.name: br-f1c

  f1u_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.84.128/26
          gateway: 192.168.84.129
    driver_opts:
      com.docker.network.bridge.name: br-f1u

  ran_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.80.128/26
          gateway: 192.168.80.129
    driver_opts:
      com.docker.network.bridge.name: br-ran

  sgi_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.2.0/24
          gateway: 172.18.2.1
    driver_opts:
      com.docker.network.bridge.name: br-sgi
