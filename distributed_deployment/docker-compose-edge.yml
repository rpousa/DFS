# Docker Compose for Edge Machine
# Deploy on PC: 192.168.0.243
# Components: CU-UP_e + UPF_e + ext_dn_e + DU_e1 + DU_e2 + UE_1

services:
  cir-generator:
    image: oaisoftwarealliance/cir-generator:v0.0.1
    container_name: cir_gen_edge
    environment:
      GENERATOR_ARGS: "--models TDL-A TDL-A TDL-A TDL-A --antennas 1x1 1x1 1x1 1x1 --delay-spreads 1.0 1.0 1.0 1.0 --speeds 0 0 0 0 --fs-hz 46080000 --fc-hz 3319680000" 
      #GENERATOR_ARGS: "--models TDL-A --antennas 1x1 --delay-spreads 1.0 --speeds 0 --fs-hz 46080000 --fc-hz 3319680000" 
      OUTPUT: "--out /opt/output/cir_db.bin"
    restart: "no"
    volumes:
      - cirdb_data:/opt/output
    #command: ["sh", "-c", "python3 external_taps/cir_generator.py $GENERATOR_ARGS $OUTPUT" ]
  # ==========================================
  # UPF Edge — Slice 3 (SST=1, SD=3)
  # ==========================================

  upf_e:
    image: upf_1:comnetsemu
    container_name: upf_e
    hostname: upf_e
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.81.154
        priority: 1000
        interface_name: eth0
      ext_net:
        ipv4_address: 192.168.82.154
        priority: 900
        interface_name: eth1
    ports:
      - "192.168.0.243:8085:8085/tcp"
      - "192.168.0.243:8805:8805/udp"
      - "192.168.0.243:2152:2152/udp"       # GTP-U N3 (from CU-UP_e)
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./configs/upf_e/upf_e_config.yaml:/openair-upf/etc/config.yaml
      - ./logs/upf_e:/openair-upf/logs
    depends_on:
      - cuup_e
    environment:
      - ETH0_IP=192.168.81.154
      - ETH1_IP=192.168.82.154
    cpuset: "25-27"
    cpus: 3.0
    cpu_shares: 2048
    oom_score_adj: -500
    ulimits:
      rtprio: 99
      memlock: -1
      nofile: 1048576
    # sysctls:
    #   - net.core.rmem_max=33554432
    #   - net.core.wmem_max=33554432  
    entrypoint: [""]
    command: >
      sh -c "sysctl -w net.ipv4.ip_forward=1 &&
             sleep 2 &&
             /openair-upf/bin/oai_upf -c /openair-upf/etc/config.yaml -o"

  ext_dn_e:
    image: ext_dn:comnetsemu
    container_name: ext_dn_e
    hostname: ext_dn_e
    cap_add:
      - SYS_NICE
      - NET_ADMIN
    networks:
      ext_net:
        ipv4_address: 192.168.82.135
        interface_name: eth0
      sgi_net:
        ipv4_address: 172.28.2.9
        interface_name: eth1
    environment:
      - EBPF_GW_SETUP=no
      - EBPF_GW_N6_IP_ADDR=192.168.82.135
      - N6_IF_NAME=eth0
      - SGI_IF_NAME=eth2
      - GW_SGI_IP_ADDR=172.28.2.9
      - N3_IF_NAME=eth1
      - GW_N3_IP_ADDR=192.168.82.135
      - UE_IP_ADDRESS_POOL_1=12.1.1.0/24
      - UE_IP_ADDRESS_POOL_2=13.1.1.0/24
      - UE_IP_ADDRESS_POOL_3=14.1.1.0/24
      - SGI_DEMO_OAI_ADDR=172.28.2.1
      - N6_UPF_IP_ADDR=192.168.82.154
    #entrypoint: ["/bin/bash","-c","sleep infinity"]
        #      "iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE;"\
        #      "ip route add 12.1.1.0/24 via 192.168.82.154 dev eth0;"\
        #      "ip route add 13.1.1.0/24 via 192.168.82.154 dev eth0;"\
        #      "ip route add 14.1.1.0/24 via 192.168.82.154 dev eth0; sleep infinity"
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./configs/ext_dn:/tmp
    depends_on:
      - upf_e
    cpuset: "22-24"
    cpus: 3.0
    cpu_shares: 512
    command: 
      - /bin/bash
      - -c
      - |
        set -ex
        update-alternatives --set iptables  /usr/sbin/iptables-nft  || true
        update-alternatives --set ip6tables /usr/sbin/ip6tables-nft || true
        iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
        ip route add 12.1.1.0/24 via 192.168.82.154 dev eth0 || true
        ip route add 13.1.1.0/24 via 192.168.82.154 dev eth0 || true
        ip route add 14.1.1.0/24 via 192.168.82.154 dev eth0 || true
        /tmp/trfgen_entrypoint.sh 
        iperf3 -s -D -p 5201
        iperf3 -s -D -p 5202
        iperf3 -s -D -p 5203
        sleep infinity
    healthcheck:
      test: /bin/bash -c "ping -c 2 192.168.82.154"
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Edge CU-UP (gNB_CU_UP_ID=0xe02)
  # Serves: DU_e2 (local)
  # E1 → CU-CP @ Core (192.168.0.200:38462)
  # ==========================================

  cuup_e:
    image: cuup:comnetsemu
    container_name: cuup_e
    hostname: cuup_e
    cap_add:
      - SYS_NICE
      - NET_ADMIN
    networks:
      core_net:
        ipv4_address: 192.168.81.140
        priority: 900
        interface_name: eth0
      #f1u_net:
      #  ipv4_address: 192.168.84.140
      #  priority: 800
      #  interface_name: eth1
    ports:
      - "192.168.0.243:2153:2153/udp"       # GTP-U F1-U (inbound from DU_e2 local)
      - "192.168.0.243:2154:2152/udp"       # GTP-U N3 (towards UPF_e)
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./configs/cuup_e/gnb-cuup-edge.sa.f1.conf:/opt/oai-gnb/etc/gnb.conf
      - ./logs/cuup_e:/opt/oai-gnb/logs
    environment:
      USE_ADDITIONAL_OPTIONS: >-
        -E --sa
        --log_config.global_log_options level,nocolor,time
        --log_config.global_log_level info
        --log_config.e1ap_log_level debug
        --log_config.f1u_log_level debug
        --log_config.gtpu_log_level debug
        --e2_agent.near_ric_ip_addr 192.168.0.200
        --e2_agent.sm_dir /usr/local/lib/flexric/
        --telnetsrv --telnetsrv.shrmod ci
        --gNBs.[0].gNB_ID 0xe00
        --gNBs.[0].gNB_CU_UP_ID 0xe02
        --gNBs.[0].E1_INTERFACE.[0].type up
        --gNBs.[0].E1_INTERFACE.[0].ipv4_cucp 192.168.0.200
        --gNBs.[0].E1_INTERFACE.[0].ipv4_cuup 192.168.81.140
        --gNBs.[0].tr_s_preference f1
        --gNBs.[0].local_s_portd 2153
        --gNBs.[0].local_s_address 192.168.81.140
        --gNBs.[0].remote_s_address 0.0.0.0
        --gNBs.[0].NETWORK_INTERFACES.GNB_IPV4_ADDRESS_FOR_NG_AMF 192.168.81.140/26
        --gNBs.[0].NETWORK_INTERFACES.GNB_IPV4_ADDRESS_FOR_NGU 192.168.81.140/26
    #    --gNBs.[0].NETWORK_INTERFACES.GNB_PORT_FOR_NGU 2155
    cpuset: "21"
    cpus: 1.0
    cpu_shares: 4096
    oom_score_adj: -600
    ulimits:
      rtprio: 99
      memlock: -1
      nofile: 1048576
    # sysctls:
    #   - net.core.rmem_max=33554432
    #   - net.core.wmem_max=33554432
    command: >
      sh -c "sleep 20 &&
             /tini -sv -- /opt/oai-gnb/bin/entrypoint.sh /opt/oai-gnb/bin/nr-cuup -O /opt/oai-gnb/etc/gnb.conf 2>&1 |
             stdbuf -oL tee /opt/oai-gnb/logs/cuup_e_stdout.log"

  # ==========================================
  # DU_e1 (CellID=22222222, PCI=1)
  # F1-C → CU-CP @ Core (192.168.0.200:38472)
  # F1-U → CU-UP_co @ Centraloffice (192.168.0.193:2153) CROSS-MACHINE
  # ==========================================

  du_e1:
    image: du:comnetsemu
    container_name: du_e1
    hostname: du_e1
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    networks:
      f1c_net:
        ipv4_address: 192.168.83.151
      ran_net:
        ipv4_address: 192.168.80.151
      core_net:
        ipv4_address: 192.168.81.151
      #f1u_net:
      #  ipv4_address: 192.168.84.151
    ports:
      - "192.168.0.243:500:500/sctp"         # F1-C local SCTP port
      - "192.168.0.243:2162:2152/udp"        # F1-U local GTP-U port
    devices:
      - /dev/net/tun:/dev/net/tun
    ipc: host
    volumes:
      - ./configs/du_e1/gnb-du.sa.band78.106prb.vrtsim.yaml:/opt/oai-gnb/etc/gnb.yaml
      - ./logs/du_e1:/opt/oai-gnb/logs
      - tmp_data:/tmp/            # shared shm descriptor
      - cirdb_data:/cirdb:ro      # CIR database
    environment:
      USE_ADDITIONAL_OPTIONS: >-
        --e2_agent.near_ric_ip_addr 192.168.0.200
        --e2_agent.sm_dir /usr/local/lib/flexric/
        --telnetsrv --telnetsrv.shrmod ci
        --Active_gNBs gNB-OAI
        --gNBs.[0].gNB_ID 0xe00
        --gNBs.[0].gNB_DU_ID 0xe01
        --gNBs.[0].gNB_name gNB-OAI
        --gNBs.[0].nr_cellid 22222222
        --gNBs.[0].servingCellConfigCommon.[0].physCellId 1
        --MACRLCs.[0].local_n_address 192.168.83.151
        --MACRLCs.[0].remote_n_address 192.168.0.200
        --MACRLCs.[0].remote_n_portd 2153                     
        --MACRLCs.[0].tr_s_preference local_L1
        --MACRLCs.[0].tr_n_preference f1
        --MACRLCs.[0].stats_max_ue 32
        --gNBs.[0].TIMERS.t300 1000
        --MACRLCs.[0].local_n_address_f1u 192.168.81.151
        --MACRLCs.[0].local_n_portd 2152
        -E --device.name vrtsim
        --vrtsim.role server
        --vrtsim.cirdb 0
        --vrtsim.timescale 1
        --vrtsim.num_ues 4
        --L1s.[0].max_ldpc_iterations 8
        --MACRLCs.[0].ulsch_max_frame_inactivity 0
        --MACRLCs.[0].ul_max_mcs 6
        --gNBs.[0].min_rxtxtime 8
        --L1s.[0].L1_rx_thread_core 4
        --thread-pool 5,6,7,8
        --L1s.[0].L1_tx_thread_core 3

#        --log_config.hw_log_level debug
#  --vrtsim.cirdb 1
# --log_config.phy_log_level debug
# --log_config.mac_log_level debug
#        
      #  -E --rfsim        
      #  --rfsimulator.[0].serveraddr server
      #  --rfsimulator.[0].serverport 4043
    #  --MACRLCs.[0].local_n_port_f1u 2156
    # --gNBs.[0].TIMERS.t301 2000
    # --gNBs.[0].TIMERS.t310 2000
    # --gNBs.[0].TIMERS.t311 30000
    # --gNBs.[0].TIMERS.t319 2000
    # --MACRLCs.[0].remote_n_address_f1u 192.168.0.193
    depends_on:
      cuup_e:
        condition: service_healthy
      cir-generator:
        condition: service_completed_successfully
    cpuset: "3-8"
    cpus: 6.0
    cpu_shares: 8192            # absolute top priority — RFSim server
    oom_score_adj: -700
    ulimits:
      rtprio: 99
      memlock: -1
      nofile: 1048576
    # sysctls:
    #   - net.core.rmem_max=33554432
    #   - net.core.wmem_max=33554432
    command: >
      sh -c "sleep 5 &&
             /tini -sv -- /opt/oai-gnb/bin/entrypoint.sh /opt/oai-gnb/bin/nr-softmodem 2>&1 "
#             stdbuf -oL tee /opt/oai-gnb/logs/du_e1_stdout.log"

  # ==========================================
  # UE_1 — 10 UEs attached to DU_e1 (RFSimulator)
  # Per requirement: ALL UEs connect to DU_e1 (which uses CU-UP @ Centraloffice)
  # ==========================================

  ue_0:
    image: ue:comnetsemu
    container_name: ue_0
    hostname: ue_0
    cap_add:
      - NET_ADMIN
      - NET_RAW
    #  - SYS_NICE
    #privileged: true
    networks:
      ran_net:
        ipv4_address: 192.168.80.168
    devices:
      - /dev/net/tun:/dev/net/tun
    ipc: host
    volumes:
      - ./configs/ue_1/nrue0.vrtsim.yaml:/opt/oai-nr-ue/etc/nr-ue.yaml
      - ./logs/ue_0:/opt/oai-nr-ue/logs
      - tmp_data:/tmp/
    environment:
      USE_ADDITIONAL_OPTIONS: >-
        -E --device.name vrtsim
        --vrtsim.role client
        --vrtsim.ue_id 0
        -r 106 --numerology 1 -C 3319680000 
        --ssb 516 
        --log_config.global_log_options level,nocolor,time
        --log_config.global_log_level debug
        --ue-nb-ant-tx 1 --ue-nb-ant-rx 1
#        -r 106 --numerology 1 --band 78 -C 3319680000 
    depends_on:
      du_e1:
        condition: service_started
    cpuset: "9-11"
    cpus: 3.0
    cpu_shares: 4096
    #oom_score_adj: -600
    ulimits:
      memlock: -1
      nofile: 1048576
    #  rtprio: 97
    command: >
      sh -c "sleep 1 &&
             /tini -sv -- /opt/oai-nr-ue/bin/entrypoint.sh /opt/oai-nr-ue/bin/nr-uesoftmodem 2>&1 "
  ue_1:
    image: ue:comnetsemu
    container_name: ue_1
    hostname: ue_1
    cap_add:
      - NET_ADMIN
      - NET_RAW
    #  - SYS_NICE
    #privileged: true
    networks:
      ran_net:
        ipv4_address: 192.168.80.169
    devices:
      - /dev/net/tun:/dev/net/tun
    ipc: host
    volumes:
      - ./configs/ue_1/nrue1.vrtsim.yaml:/opt/oai-nr-ue/etc/nr-ue.yaml
      - ./logs/ue_1:/opt/oai-nr-ue/logs
      - tmp_data:/tmp/
    environment:
      USE_ADDITIONAL_OPTIONS: >-
        -E --device.name vrtsim
        --vrtsim.role client
        --vrtsim.ue_id 1
        -r 106 --numerology 1 -C 3319680000 
        --ssb 516 
        --log_config.global_log_options level,nocolor,time
        --log_config.global_log_level info
        --ue-nb-ant-tx 1 --ue-nb-ant-rx 1
#        -r 106 --numerology 1 --band 78 -C 3319680000 
    depends_on:
      du_e1:
        condition: service_started
    cpuset: "12-14"
    cpus: 3.0
    cpu_shares: 4096
    # oom_score_adj: -600
    ulimits:
      memlock: -1
      nofile: 1048576
    #    rtprio: 99
    command: >
      sh -c "sleep 1 &&
             /tini -sv -- /opt/oai-nr-ue/bin/entrypoint.sh /opt/oai-nr-ue/bin/nr-uesoftmodem 2>&1 "
  ue_2:
    image: ue:comnetsemu
    container_name: ue_2
    hostname: ue_2
    cap_add:
      - NET_ADMIN
      - NET_RAW
    #  - SYS_NICE
    #privileged: true
    networks:
      ran_net:
        ipv4_address: 192.168.80.170
    devices:
      - /dev/net/tun:/dev/net/tun
    ipc: host
    volumes:
      - ./configs/ue_1/nrue2.vrtsim.yaml:/opt/oai-nr-ue/etc/nr-ue.yaml
      - ./logs/ue_2:/opt/oai-nr-ue/logs
      - tmp_data:/tmp/
    environment:
      USE_ADDITIONAL_OPTIONS: >-
        -E --device.name vrtsim
        --vrtsim.role client
        --vrtsim.ue_id 2
        --ue-nb-ant-tx 1 --ue-nb-ant-rx 1
        -r 106 --numerology 1 -C 3319680000 
        --ssb 516 
        --log_config.global_log_options level,nocolor,time
        --log_config.global_log_level info
#        -r 106 --numerology 1 --band 78 -C 3319680000 
    depends_on:
      du_e1:
        condition: service_started
    cpuset: "15-17"
    cpus: 3.0
    cpu_shares: 4096
    # oom_score_adj: -600
    ulimits:
      memlock: -1
      nofile: 1048576
    #   rtprio: 99
    command: >
      sh -c "sleep 1 &&
             /tini -sv -- /opt/oai-nr-ue/bin/entrypoint.sh /opt/oai-nr-ue/bin/nr-uesoftmodem 2>&1 "
  ue_3:
    image: ue:comnetsemu
    container_name: ue_3
    hostname: ue_3
    cap_add:
      - NET_ADMIN
      - NET_RAW
    #  - SYS_NICE
    #privileged: true
    networks:
      ran_net:
        ipv4_address: 192.168.80.171
    devices:
      - /dev/net/tun:/dev/net/tun
    ipc: host
    volumes:
      - ./configs/ue_1/nrue3.vrtsim.yaml:/opt/oai-nr-ue/etc/nr-ue.yaml
      - ./logs/ue_3:/opt/oai-nr-ue/logs
      - tmp_data:/tmp/
    environment:
      USE_ADDITIONAL_OPTIONS: >-
        -E --device.name vrtsim
        --vrtsim.role client
        --vrtsim.ue_id 3
        -r 106 --numerology 1 -C 3319680000 
        --ssb 516 
        --log_config.global_log_options level,nocolor,time
        --log_config.global_log_level info
        --ue-nb-ant-tx 1 --ue-nb-ant-rx 1
#        -r 106 --numerology 1 --band 78 -C 3319680000 
    depends_on:
      du_e1:
        condition: service_started
    cpuset: "18-20"
    cpus: 3.0
    cpu_shares: 4096
    # oom_score_adj: -600
    ulimits:
      memlock: -1
      nofile: 1048576
    #  rtprio: 99
    command: >
      sh -c "sleep 1 &&
             /tini -sv -- /opt/oai-nr-ue/bin/entrypoint.sh /opt/oai-nr-ue/bin/nr-uesoftmodem 2>&1 "
 #            stdbuf -oL tee /opt/oai-nr-ue/logs/ue_1_stdout.log"

# ==========================================
# Networks Configuration
# ==========================================

networks:
  core_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.81.128/26
          gateway: 192.168.81.129
    driver_opts:
      com.docker.network.bridge.name: br-core

  ext_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.82.128/26
          gateway: 192.168.82.129
    driver_opts:
      com.docker.network.bridge.name: br-ext

  f1c_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.83.128/26
          gateway: 192.168.83.129
    driver_opts:
      com.docker.network.bridge.name: br-f1c

  # f1u_net:
  #   driver: bridge
  #   ipam:
  #     config:
  #       - subnet: 192.168.84.128/26
  #         gateway: 192.168.84.129
  #   driver_opts:
  #     com.docker.network.bridge.name: br-f1u

  ran_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.80.128/26
          gateway: 192.168.80.129
    driver_opts:
      com.docker.network.bridge.name: br-ran

  sgi_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.2.0/24
          gateway: 172.28.2.1
    driver_opts:
      com.docker.network.bridge.name: br-sgi
volumes:
  cirdb_data:
  tmp_data: