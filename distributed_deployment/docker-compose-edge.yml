#version: '3.8'

# Docker Compose for Machine 2 (Edge RAN + Edge UPF)
# Deploy on PC: 192.168.0.243
# Components: CU-UP (edge) + UPF (edge) + DU + UEs + FlexRIC
#
# CRITICAL: Networks are marked as 'external' to connect to Machine 1
# Machine 1 must be deployed FIRST to create the shared networks

services:

  # ==========================================
  # Edge CU-UP
  # ==========================================

  cuup_1:
    image: cuup:comnetsemu
    container_name: cuup_1
    hostname: cuup_1
    cap_add:
      - SYS_NICE
      - NET_ADMIN
    networks:
      core_net:
        ipv4_address: 192.168.61.144
      e1_net:
        ipv4_address: 192.168.75.144
      f1u_net:
        ipv4_address: 192.168.74.144
    ports:
      - "2154:2153/udp"                        # GTP-U F1-U (different port)
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./configs/cuup/gnb-cuup.sa.f1.conf:/opt/oai-gnb/etc/gnb.conf
      - ./logs/cuup:/opt/oai-gnb/logs
    environment:
      USE_ADDITIONAL_OPTIONS: >-
                               --e2_agent.near_ric_ip_addr 192.168.61.150
                               --e2_agent.sm_dir /usr/local/lib/flexric/ 
                               --telnetsrv --telnetsrv.shrmod ci
                               -E --sa --log_config.global_log_options level,nocolor,time
                               --gNBs.[0].gNB_ID  0xe00
                               --gNBs.[0].gNB_CU_UP_ID  0xe01
                               --gNBs.[0].E1_INTERFACE.[0].type up
                               --gNBs.[0].E1_INTERFACE.[0].ipv4_cucp 192.168.0.193
                               --gNBs.[0].E1_INTERFACE.[0].ipv4_cuup 192.168.75.144
                               --gNBs.[0].tr_s_preference f1
                               --gNBs.[0].local_s_portd 2153 
                               --gNBs.[0].local_s_address 192.168.74.144
                               --gNBs.[0].remote_s_address 0.0.0.0
                               --gNBs.[0].NETWORK_INTERFACES.GNB_IPV4_ADDRESS_FOR_NG_AMF 192.168.71.144/26
                               --gNBs.[0].NETWORK_INTERFACES.GNB_IPV4_ADDRESS_FOR_NGU 192.168.71.144/26
    
    command: >
      sh -c "sleep 20 &&
             /tini -sv -- /opt/oai-gnb/bin/entrypoint.sh /opt/oai-gnb/bin/nr-cuup -O /opt/oai-gnb/etc/gnb.conf"

  # ==========================================
  # Distributed Unit (DU) with RFSimulator
  # ==========================================

  du_1:
    image: du:comnetsemu
    container_name: du_1
    hostname: du_1
    cap_add:
      - SYS_NICE
      - NET_ADMIN
    networks:
      f1c_net:
        ipv4_address: 192.168.73.151
      f1u_net:
        ipv4_address: 192.168.74.151
      ran_net:
        ipv4_address: 192.168.80.151
      core_net:                          
        ipv4_address: 192.168.61.151  
    ports:
      - "192.168.0.243:500:500/sctp"      # F1-C local SCTP port
      - "192.168.0.243:2155:2152/udp"     # F1-U local GTP-U port
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./configs/du_1/gnb-du.sa.band78.106prb.rfsim.conf:/opt/oai-gnb/etc/gnb.conf
      - ./logs/du_1:/opt/oai-gnb/logs
    environment:
      # RFSIMULATOR MODE - DU as server
      # F1-C and F1-U connect to CU-CP/CU-UP on Machine 1
      USE_ADDITIONAL_OPTIONS: >-
                                --e2_agent.near_ric_ip_addr 192.168.61.150 --e2_agent.sm_dir /usr/local/lib/flexric/ 
                                --telnetsrv --telnetsrv.shrmod ci
                                -E --rfsim --Active_gNBs gNB-OAI
                                --gNBs.[0].gNB_ID 0xe00 --gNBs.[0].gNB_DU_ID 0xe00  --gNBs.[0].gNB_name gNB-OAI
                                --gNBs.[0].nr_cellid 11111111 --gNBs.[0].min_rxtxtime 6
                                --gNBs.[0].servingCellConfigCommon.[0].physCellId 1                                
                                --MACRLCs.[0].local_n_address 192.168.73.151
                                --MACRLCs.[0].remote_n_address 192.168.0.193
                                --MACRLCs.[0].local_n_address_f1u 192.168.74.151
                                --MACRLCs.[0].remote_n_portd 2153
                                --MACRLCs.[0].remote_n_portc 38472
                                --MACRLCs.[0].tr_s_preference local_L1
                                --MACRLCs.[0].tr_n_preference f1
                                --MACRLCs.[0].stats_max_ue 11
                                --gNBs.[0].TIMERS.t300 1000
                                --rfsimulator.[0].serveraddr server
                                --rfsimulator.[0].serverport 4043
                                --log_config.phy_log_level info
                                --log_config.mac_log_level info
#--gNBs.[0].servingCellConfigCommon.[0].initialUplinkBWP.rach_ConfigCommon.rach_ConfigGeneric.ra_ResponseWindow 20
    depends_on:
      - cuup_1
    command: >
      sh -c "sleep 25 &&
             /tini -sv -- /opt/oai-gnb/bin/entrypoint.sh /opt/oai-gnb/bin/nr-softmodem"

  # ==========================================
  # FlexRIC (Near-RT RIC)
  # ==========================================

  flexric:
    image: flexric_test:comnetsemu
    container_name: flexric
    hostname: flexric
    cap_add:
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.61.150
    ports:
      - "192.168.0.243:36421:36421/sctp"      # F1-C local SCTP port
      - "192.168.0.243:36422:36422/sctp" 
    volumes:
      - ./configs/flexric:/usr/local/etc/flexric
      - ./logs/flexric:/usr/local/logs
      - ./flexric_volumes/ric_watchdog.sh:/usr/local/bin/ric_watchdog.sh
      - ./flexric_volumes/topology.py:/usr/local/flexric/xApp/python/topology.py
      - ./flexric_volumes/xapp_functs.py:/usr/local/flexric/xApp/python/xapp_functs.py
      - ./flexric_volumes/xapp_test.py:/usr/local/flexric/xApp/python/xapp.py
    depends_on:
      - du_1
    command: >
      sh -c "sleep 5 &&
             /usr/local/bin/ric_watchdog.sh"

  # ==========================================
  # User Equipment (10 UEs) - RFSimulator Mode
  # ==========================================

  ue_1:
    image: ue:comnetsemu
    container_name: ue_1
    hostname: ue_1
    ulimits:
      memlock:
        soft: -1
        hard: -1
    cap_add:
      - SYS_NICE
      - NET_ADMIN
      - NET_RAW
    networks:
      ran_net:
        ipv4_address: 192.168.80.170
    volumes:
      - ./ue_volumes/nrue.rfsim.conf:/opt/oai-nr-ue/etc/nr-ue.conf
      - ./ue_volumes/ue_entrypoint.sh:/opt/oai-nr-ue/bin/entrypoint.sh
      - ./logs/ue_1:/opt/oai-nr-ue/logs
    environment:
      OPENAIR_DIR: /opt/oai-nr-ue
      # Multi-UE RFSimulator - UEs connect to DU as clients
      USE_ADDITIONAL_OPTIONS: >-
       --rfsim
       -r 106
       --numerology 1
       --band 78
       -C 3619200000
       --ssb 516
       -E
       --log_config.global_log_level info
       --num-ues 10
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      - du_1
      - flexric
    command: >
      sh -c "sleep 35 &&
             /tini -sv -- /opt/oai-nr-ue/bin/entrypoint.sh /opt/oai-nr-ue/bin/nr-uesoftmodem"

# ==========================================
# Networks Configuration
# ==========================================
# CRITICAL: Most networks are EXTERNAL - created by Machine 1
# Only ran_net is local to Machine 2

networks:
  core_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.61.128/26
          gateway: 192.168.61.129
    driver_opts:
      com.docker.network.bridge.name: br-core

  ext_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.72.128/26
          gateway: 192.168.72.129
    driver_opts:
      com.docker.network.bridge.name: br-ext

  f1c_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.73.128/26
          gateway: 192.168.73.129
    driver_opts:
      com.docker.network.bridge.name: br-f1c

  f1u_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.74.128/26
          gateway: 192.168.74.129
    driver_opts:
      com.docker.network.bridge.name: br-f1u

  e1_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.75.128/26
          gateway: 192.168.75.129
    driver_opts:
      com.docker.network.bridge.name: br-e1
  # Local network - only on Machine 2
  ran_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.80.128/26
          gateway: 192.168.80.129
    driver_opts:
      com.docker.network.bridge.name: br-ran
  
  n3_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.128/26
          gateway: 192.168.100.129
    driver_opts:
      com.docker.network.bridge.name: br-n3
  
  sgi_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
    driver_opts:
      com.docker.network.bridge.name: br-sgi


# ==========================================
# Volumes
# ==========================================

volumes:
  flexric_data:
    driver: local
