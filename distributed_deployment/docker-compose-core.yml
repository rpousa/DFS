version: '3.8'

# Docker Compose for Core Network Functions
# Deploy on PC: 192.168.0.193
# This PC runs all 5G Core Network components

services:
  # ==========================================
  # 5G Core Network Functions
  # ==========================================
  
  mysql:
    image: mysql:comnetsemu
    container_name: mysql
    hostname: mysql
    cap_add:
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.71.131
    ports:
      - "192.168.0.193:3306:3306"  # Expose to physical network
    volumes:
      - mysql_data:/var/lib/mysql
      - ./configs/mysql:/docker-entrypoint-initdb.d
    environment:
      - MYSQL_ROOT_PASSWORD=linux
      - MYSQL_DATABASE=oai_db
    command: >
      sh -c "mysqld --user=mysql --initialize-insecure --init-file=/docker-entrypoint-initdb.d/oai_db.sql &&
             mysqld --user=mysql --bind-address=0.0.0.0"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  nrf:
    image: nrf:comnetsemu
    container_name: nrf
    hostname: nrf
    cap_add:
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.71.130
    ports:
      - "192.168.0.193:8080:80"     # HTTP API
      - "192.168.0.193:8081:8080"   # Management
    volumes:
      - ./configs/nrf:/openair-nrf/etc
      - ./logs/nrf:/openair-nrf/logs
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "sleep 5 &&
             /openair-nrf/bin/oai_nrf -c /openair-nrf/etc/config.yaml -o"
    extra_hosts:
      - "core-pc:192.168.0.193"
      - "ran-pc:192.168.0.243"
      - "gateway-pc:192.168.0.200"

  smf:
    image: smf:comnetsemu
    container_name: smf
    hostname: smf
    cap_add:
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.71.133
    ports:
      - "192.168.0.193:8805:8805"   # PFCP
      - "192.168.0.193:29502:29502" # HTTP API
    volumes:
      - ./configs/smf:/openair-smf/etc
      - ./logs/smf:/openair-smf/logs
    depends_on:
      - nrf
    command: >
      sh -c "sleep 5 &&
             /openair-smf/bin/oai_smf -c /openair-smf/etc/config.yaml -o"
    extra_hosts:
      - "core-pc:192.168.0.193"
      - "ran-pc:192.168.0.243"

  pcf:
    image: pcf:comnetsemu
    container_name: pcf
    hostname: pcf
    cap_add:
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.71.139
    ports:
      - "192.168.0.193:8806:8080"
    volumes:
      - ./configs/pcf:/openair-pcf/etc
      - ./logs/pcf:/openair-pcf/logs
    depends_on:
      - nrf
    command: >
      sh -c "sleep 5 &&
             /openair-pcf/bin/oai_pcf -c /openair-pcf/etc/config.yaml -o"
    extra_hosts:
      - "core-pc:192.168.0.193"

  nssf:
    image: nssf:comnetsemu
    container_name: nssf
    hostname: nssf
    cap_add:
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.71.135
    ports:
      - "192.168.0.193:8807:8080"
    volumes:
      - ./configs/nssf:/openair-nssf/etc
      - ./logs/nssf:/openair-nssf/logs
    depends_on:
      - nrf
    command: >
      sh -c "sleep 5 &&
             /openair-nssf/bin/oai_nssf -c /openair-nssf/etc/config.yaml -o"
    extra_hosts:
      - "core-pc:192.168.0.193"

  amf:
    image: amf:comnetsemu
    container_name: amf
    hostname: amf
    cap_add:
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.71.132
    ports:
      - "192.168.0.193:38412:38412"   # NGAP (N2) - Critical for RAN
      - "192.168.0.193:38412:38412/udp"
      - "192.168.0.193:29518:29518"   # HTTP API
    volumes:
      - ./configs/amf:/openair-amf/etc
      - ./logs/amf:/openair-amf/logs
    depends_on:
      - nrf
      - smf
    command: >
      sh -c "sleep 5 &&
             /openair-amf/bin/oai_amf -c /openair-amf/etc/config.yaml -o"
    extra_hosts:
      - "core-pc:192.168.0.193"
      - "ran-pc:192.168.0.243"

  udm:
    image: udm:comnetsemu
    container_name: udm
    hostname: udm
    cap_add:
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.71.136
    ports:
      - "192.168.0.193:8808:8080"
    volumes:
      - ./configs/udm:/openair-udm/etc
      - ./logs/udm:/openair-udm/logs
    depends_on:
      - nrf
    command: >
      sh -c "sleep 5 &&
             /openair-udm/bin/oai_udm -c /openair-udm/etc/config.yaml -o"
    extra_hosts:
      - "core-pc:192.168.0.193"

  udr:
    image: udr:comnetsemu
    container_name: udr
    hostname: udr
    cap_add:
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.71.137
    ports:
      - "192.168.0.193:8809:8080"
    volumes:
      - ./configs/udr:/openair-udr/etc
      - ./logs/udr:/openair-udr/logs
    depends_on:
      - nrf
    command: >
      sh -c "sleep 5 &&
             /openair-udr/bin/oai_udr -c /openair-udr/etc/config.yaml -o"
    extra_hosts:
      - "core-pc:192.168.0.193"

  ausf:
    image: ausf:comnetsemu
    container_name: ausf
    hostname: ausf
    cap_add:
      - SYS_NICE
    networks:
      core_net:
        ipv4_address: 192.168.71.138
    ports:
      - "192.168.0.193:8810:8080"
    volumes:
      - ./configs/ausf:/openair-ausf/etc
      - ./logs/ausf:/openair-ausf/logs
    depends_on:
      - nrf
    command: >
      sh -c "sleep 5 &&
             /openair-ausf/bin/oai_ausf -c /openair-ausf/etc/config.yaml -o"
    extra_hosts:
      - "core-pc:192.168.0.193"

  # ==========================================
  # User Plane Function
  # ==========================================

  upf:
    image: upf_1:comnetsemu
    container_name: upf
    hostname: upf
    cap_add:
      - SYS_NICE
      - NET_ADMIN
    cap_drop:
      - ALL
    networks:
      core_net:
        ipv4_address: 192.168.71.134
      ext_net:
        ipv4_address: 192.168.72.134
    ports:
      - "192.168.0.193:8805:8805/udp"  # PFCP
      - "192.168.0.193:2152:2152/udp"  # GTP-U
    volumes:
      - ./configs/upf:/openair-upf/etc
      - ./logs/upf:/openair-upf/logs
    depends_on:
      - nrf
      - smf
    command: >
      sh -c "sysctl -w net.ipv6.conf.all.accept_ra=2 &&
             sleep 10 &&
             /openair-upf/bin/oai_upf -c /openair-upf/etc/config.yaml -o"
    extra_hosts:
      - "core-pc:192.168.0.193"
      - "ran-pc:192.168.0.243"

  ext_dn:
    image: ext_dn:comnetsemu
    container_name: ext_dn
    hostname: ext_dn
    cap_add:
      - SYS_NICE
      - NET_ADMIN
    networks:
      ext_net:
        ipv4_address: 192.168.72.135
    environment:
      - EBPF_GW_SETUP=yes
      - EBPF_GW_N6_IP_ADDR=192.168.72.135
      - N6_IF_NAME=eth0
      - SGI_IF_NAME=eth0
      - GW_SGI_IP_ADDR=192.168.0.200  # Physical gateway
      - N3_IF_NAME=eth1
      - GW_N3_IP_ADDR=192.168.100.135
      - UE_IP_ADDRESS_POOL_1=12.1.1.0/24
      - UE_IP_ADDRESS_POOL_2=13.1.1.0/24
      - UE_IP_ADDRESS_POOL_3=14.1.1.0/24
      - SGI_DEMO_OAI_ADDR=192.168.0.200
      - N6_UPF_IP_ADDR=192.168.72.134
    volumes:
      - ./configs/ext_dn:/tmp
    depends_on:
      - upf
    command: >
      sh -c "ifconfig eth0 mtu 1460 &&
             sleep 5 &&
             /tmp/trfgen_entrypoint.sh"

  # Optional: Second UPF for MEC/Edge scenarios
  upf_1:
    image: upf_1:comnetsemu
    container_name: upf_1
    hostname: upf_1
    cap_add:
      - SYS_NICE
      - NET_ADMIN
    cap_drop:
      - ALL
    networks:
      core_net:
        ipv4_address: 192.168.71.160
      ext_net:
        ipv4_address: 192.168.72.160
    ports:
      - "192.168.0.193:8815:8805/udp"  # PFCP
      - "192.168.0.193:2153:2152/udp"  # GTP-U
    volumes:
      - ./configs/upf_1:/openair-upf/etc
      - ./logs/upf_1:/openair-upf/logs
    depends_on:
      - nrf
      - smf
    command: >
      sh -c "sysctl -w net.ipv6.conf.all.accept_ra=2 &&
             sleep 10 &&
             /openair-upf/bin/oai_upf -c /openair-upf/etc/config.yaml -o"
    extra_hosts:
      - "core-pc:192.168.0.193"
      - "ran-pc:192.168.0.243"

  ext_dn_1:
    image: ext_dn:comnetsemu
    container_name: ext_dn_1
    hostname: ext_dn_1
    cap_add:
      - SYS_NICE
      - NET_ADMIN
    networks:
      ext_net:
        ipv4_address: 192.168.72.161
    environment:
      - EBPF_GW_SETUP=yes
      - EBPF_GW_N6_IP_ADDR=192.168.72.161
      - N6_IF_NAME=eth0
      - SGI_IF_NAME=eth0
      - N6_UPF_IP_ADDR=192.168.72.160
      - GW_SGI_IP_ADDR=192.168.0.200
    volumes:
      - ./configs/ext_dn_1:/tmp
    depends_on:
      - upf_1
    command: >
      sh -c "ifconfig eth0 mtu 1460 &&
             sleep 5 &&
             /tmp/trfgen_entrypoint.sh"

# ==========================================
# Networks Configuration
# ==========================================

networks:
  core_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.71.0/26
          gateway: 192.168.71.1
    driver_opts:
      com.docker.network.bridge.name: br-core

  ext_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.72.0/26
          gateway: 192.168.72.1
    driver_opts:
      com.docker.network.bridge.name: br-ext

# ==========================================
# Volumes
# ==========================================

volumes:
  mysql_data:
    driver: local
