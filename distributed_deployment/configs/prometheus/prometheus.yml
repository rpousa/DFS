global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 15s
  external_labels:
    testbed: 5g-distributed
    collector: core

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # --- Host metrics (all 3 machines, via host LAN IPs) ---
  - job_name: node
    static_configs:
      - targets: ['192.168.0.200:9100']
        labels: { host: core,          role: core }
      - targets: ['192.168.0.193:9100']
        labels: { host: centraloffice, role: centraloffice }
      - targets: ['192.168.0.243:9100']
        labels: { host: edge,          role: edge }

  # --- Container metrics (all 3 machines) ---
  - job_name: cadvisor
    static_configs:
      - targets: ['192.168.0.200:8081']
        labels: { host: core,          role: core }
      - targets: ['192.168.0.193:8081']
        labels: { host: centraloffice, role: centraloffice }
      - targets: ['192.168.0.243:8081']
        labels: { host: edge,          role: edge }

  # --- xApp / FlexRIC KPMs (local to Core, via core_net bridge) ---
  - job_name: flexric_xapp
    metrics_path: /metrics
    static_configs:
      - targets: ['192.168.71.150:9464']
        labels: { component: xapp, ric: flexric }

  # --- Prometheus self-scrape ---
  - job_name: prometheus
    static_configs:
      - targets: ['192.168.0.200:9080']
