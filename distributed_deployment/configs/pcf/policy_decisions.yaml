# IMSI ...110 is the single UE with eMBB, URLLC and mIoT PDU sessions. A SUPI
# decision covers all of its sessions, so it must not steer to one slice's DNAI
# (rule-embb -> internet-embb would send the URLLC/mIoT sessions to upf_co).
# rule-any has no traffic steering: the SMF picks the UPF by S-NSSAI + DNN,
# and each UPF registers exactly one (upf_co oai/SST1, upf_e oai.2/SST2,
# upf_core oai.3/SST3). Previous: { supi_imsi: "208950000000110", pcc_rules: [rule-embb] }
decision_supi1:  { supi_imsi: "208950000000110", pcc_rules: [rule-any] }
