# OAI CN Configuration File - Two-Machine Deployment
# Machine 1 (192.168.0.193): Core Network + CU-CP + CU-UP
# Machine 2 (192.168.0.243): Edge RAN + Edge UPF + UEs
#
# IMPORTANT: This file is used by ALL NFs on BOTH machines
# NFs use Docker bridge IPs (192.168.71.x) internally
# Cross-machine communication works because ports are exposed on physical IPs

############# Common configuration

# Log level for all the NFs
log_level:
  general: debug

# If you enable registration, the other NFs will use the NRF discovery mechanism
register_nf:
  general: yes

http_version: 2

############## SBI Interfaces
### Each NF takes its local SBI interfaces and remote interfaces from here, unless it gets them using NRF discovery mechanisms
nfs:
  amf:
    host: 192.168.0.193              # AMF on Machine 1 (Docker IP)
    sbi:
      port: 8080
      api_version: v1
      interface_name: amf-sw1
    n2:
      interface_name: amf-sw1
      port: 38412                     # Exposed on 192.168.0.193:38412 for Machine 2 CU-CP

  smf:
    host: 192.168.0.193                # SMF on Machine 1 (Docker IP)
    sbi:
      port: 8080
      api_version: v1
      interface_name: smf-sw1
    n4:
      interface_name: smf-sw1
      port: 8805                      # Exposed on 192.168.0.193:8805 for Machine 2 UPF

  upf:
    host: 192.168.0.193               # Primary UPF on Machine 1 (Docker IP)
    sbi:
      port: 8080
      api_version: v1
      interface_name: upf-core
    n3:
      interface_name: upf-core
      port: 2152                      # Exposed on 192.168.0.193:2152 for Machine 2 CU-UP
    n4:
      interface_name: upf-core
      port: 8805
    n6:
      interface_name: upf-ext_dn
    n9:
      interface_name: upf-core
      port: 2152

  # Edge UPF on Machine 2 (if needed for local breakout)
  # upf_edge:
  #   host: 192.168.71.160            # Edge UPF on Machine 2 (Docker IP)
  #   sbi:
  #     port: 8080
  #     api_version: v1
  #     interface_name: upf-core
  #   n3:
  #     interface_name: upf-core
  #     port: 2152
  #   n4:
  #     interface_name: upf-core
  #     port: 8805
  #   n6:
  #     interface_name: upf-ext_dn
  #   n9:
  #     interface_name: upf-core
  #     port: 2152

  spgwu:
    host: 192.168.0.193  
    sbi:
      port: 8080
      api_version: v1
      interface_name: spgwu-sw1

  udm:
    host: 192.168.0.193                # UDM on Machine 1 (Docker IP)
    sbi:
      port: 8080
      api_version: v1
      interface_name: udm-sw1

  udr:
    host: 192.168.0.193               # UDR on Machine 1 (Docker IP)
    sbi:
      port: 8080
      api_version: v1
      interface_name: udr-sw1

  ausf:
    host: 192.168.0.193               # AUSF on Machine 1 (Docker IP)
    sbi:
      port: 8080
      api_version: v1
      interface_name: ausf-sw1

  nrf:
    host: 192.168.0.193                # NRF on Machine 1 (Docker IP)
    sbi:
      port: 9090                      # Exposed on 192.168.0.193:9090 for Machine 2
      api_version: v1
      interface_name: nrf-sw1

  pcf:
    host: 192.168.0.193               # PCF on Machine 1 (Docker IP)
    sbi:
      port: 8080
      api_version: v1
      interface_name: pcf-sw1

  nssf:
    host: 192.168.0.193                # NSSF on Machine 1 (Docker IP)
    sbi:
      port: 8080
      api_version: v1
      interface_name: nssf-sw1

#### Common for UDR and AMF
database:
  host: 192.168.0.193                  # MySQL on Machine 1 (Docker IP)
  user: test
  type: mysql
  password: test
  database_name: oai_db
  generate_random: true
  connection_timeout: 300             # seconds

## general single_nssai configuration
## Defines YAML anchors, which are reused in the config file
snssais:
  - &embb_slice1
    sst: 1
    sd: 000001                        # Enhanced Mobile Broadband
  - &urllc_slice
    sst: 2
    sd: 000001                        # Ultra-Reliable Low-Latency Communications
  - &miot_slice
    sst: 3 
    sd: 000001                        # Massive IoT

############## NF-specific configuration
amf:
  pid_directory: "/var/run"
  amf_name: "OAI-AMF"
  # This really depends on if we want to keep the "mini" version or not
  support_features_options:
    enable_simple_scenario: no
    enable_nssf: yes
    enable_smf_selection: yes
    #use_external_udm: yes 
  relative_capacity: 30
  statistics_timer_interval: 20       # in seconds
  emergency_support: false
  served_guami_list:
    - mcc: 208                        # Mobile Country Code (France)
      mnc: 95                         # Mobile Network Code
      amf_region_id: 01
      amf_set_id: 001
      amf_pointer: 01
    - mcc: 001
      mnc: 01
      amf_region_id: 01
      amf_set_id: 001
      amf_pointer: 01
  plmn_support_list:
    - mcc: 208 
      mnc: 95
      tac: 0x0001                     # Tracking Area Code
      nssai:
        - *embb_slice1                # All three network slices supported
        - *urllc_slice
        - *miot_slice
  supported_integrity_algorithms:
    - "NIA0"
    - "NIA1"
    - "NIA2"
  supported_encryption_algorithms:
    - "NEA0"
    - "NEA1"
    - "NEA2"

smf:
  ue_mtu: 1500
  support_features: 
    use_local_subscription_info: no   # Use infos from UDM (via NRF discovery)
    use_local_pcc_rules: no           # Use infos from PCF (via NRF discovery)
  
  # UPF configuration resolved via NRF
  # Both Primary UPF (Machine 1) and Edge UPF (Machine 2) will register with NRF
  # SMF will discover them dynamically based on network slice and DNN
  
  ue_dns:
    primary_ipv4: "8.8.8.8"           # Google DNS
    primary_ipv6: "2001:4860:4860::8888"
    secondary_ipv4: "1.1.1.1"         # Cloudflare DNS
    secondary_ipv6: "2001:4860:4860::8888"
  
  #ims:
  #  pcscf_ipv4: "8.8.8.8"
  
  smf_info:
    sNssaiSmfInfoList:
      - sNssai: *embb_slice1
        dnnSmfInfoList:
          - dnn: "oai"                # DNN for eMBB slice
      - sNssai: *urllc_slice
        dnnSmfInfoList:
          - dnn: "oai.2"              # DNN for URLLC slice
      - sNssai: *miot_slice
        dnnSmfInfoList:
          - dnn: "oai.2"              # DNN for mIoT slice

  # Local subscription info (used only if use_local_subscription_info: yes)
  local_subscription_infos:
    - single_nssai: *embb_slice1
      dnn: "oai"
      qos_profile:
        5qi: 9                        # 5G QoS Identifier (Non-GBR)
        session_ambr_ul: "1Mbps"
        session_ambr_dl: "2Mbps"
    - single_nssai: *urllc_slice
      dnn: "oai.2"
      qos_profile:
        5qi: 86                       # Delay-critical GBR
        session_ambr_ul: "10Mbps"
        session_ambr_dl: "10Mbps"
    - single_nssai: *miot_slice
      dnn: "oai.2"
      qos_profile:
        5qi: 76                       # V2X
        session_ambr_ul: "20Mbps"
        session_ambr_dl: "10Mbps"

upf:
  support_features:
    enable_bpf_datapath: off          # If "on": BPF is used as datapath else simpleswitch
    enable_qos: off                   # Only supported for BPF datapath
    enable_snat: off                  # If "on": Source natting is done for UE
  
  # N6 gateway for internet connectivity
  remote_n6_gw: 192.168.72.135        # External DN on Machine 1 (for Primary UPF)
  # For Edge UPF on Machine 2, this would be: 192.168.72.161
  
  # UPF info registered with NRF
  upf_info:
    sNssaiUpfInfoList:
      - sNssai: *embb_slice1
        dnnUpfInfoList:
          - dnn: "oai"
      - sNssai: *urllc_slice
        dnnUpfInfoList:
          - dnn: "oai.2"
      - sNssai: *miot_slice
        dnnUpfInfoList:
          - dnn: "oai.2"

## DNN (Data Network Name) configuration
## IP pools for UE addresses
dnns:
  - dnn: "oai"
    pdu_session_type: "IPV4"
    ipv4_subnet: "12.1.1.0/24"        # Primary UPF pool (Machine 1)
  - dnn: "oai.2"
    pdu_session_type: "IPV4"
    ipv4_subnet: "13.1.1.0/24"        # Secondary pool (can be used by Edge UPF)
  - dnn: "oai.3"
    pdu_session_type: "IPV4"
    ipv4_subnet: "14.1.1.0/24"        # Tertiary pool

# Edge UPF on Machine 2 configuration
# NOTE: Edge UPF will use a separate config file (config_edge.yaml) with:
# - remote_n6_gw: 192.168.72.161 (Edge Ext DN)
# - Different IP pools: 12.2.1.0/24, 13.2.1.0/24, 14.2.1.0/24

nrf:
  heartbeat: 10                       # NF heartbeat interval in seconds
  suspended_nf_interval: 20           # Interval to check suspended NFs

pcf:
  local_policy:
    policy_decisions_path: /openair-pcf/policies/policy_decisions
    pcc_rules_path: /openair-pcf/policies/pcc_rules
    traffic_rules_path: /openair-pcf/policies/traffic_rules

nssf:
  slice_config_path: /openair-nssf/etc/nssf_slice_config.yaml

################################################################################
# Two-Machine Deployment Notes:
#
# 1. NETWORK ARCHITECTURE:
#    - All Core NFs run on Machine 1 (192.168.0.193)
#    - Docker bridge networks use 192.168.71.x/26 range
#    - Physical host ports expose critical services
#
# 2. CROSS-MACHINE COMMUNICATION:
#    Machine 2 components connect to Machine 1 via:
#    - CU-CP → AMF: 192.168.0.193:38412 (N2/NGAP)
#    - DU → CU-CP: 192.168.0.193:38472 (F1-C)
#    - DU → CU-UP: 192.168.0.193:2153 (F1-U)
#    - CU-UP → UPF: 192.168.0.193:2152 (N3/GTP-U)
#    - Edge UPF → SMF: 192.168.0.193:8805 (N4/PFCP)
#    - All NFs → NRF: 192.168.0.193:9090 (Service Discovery)
#
# 3. NRF SERVICE DISCOVERY:
#    - NRF runs on Machine 1
#    - All NFs register with NRF at startup
#    - Machine 2 NFs can discover Machine 1 services via NRF
#    - NRF accessible at: http://localhost:9090 (internal)
#                         http://192.168.0.193:9090 (external)
#
# 4. UPF DEPLOYMENT:
#    - Primary UPF on Machine 1: 192.168.71.134
#    - Edge UPF on Machine 2: 192.168.71.160
#    - Both register with NRF under different profiles
#    - SMF selects UPF based on network slice and location
#
# 5. IP ADDRESS POOLS:
#    Primary UPF (Machine 1): 12.1.1.0/24, 13.1.1.0/24, 14.1.1.0/24
#    Edge UPF (Machine 2):    12.2.1.0/24, 13.2.1.0/24, 14.2.1.0/24
#
# 6. CONFIG FILE USAGE:
#    - This file is used by ALL NFs on Machine 1
#    - Machine 2 uses a copy with Edge UPF section modified
#    - Or: Use same file for both, Edge UPF overrides via environment
#
################################################################################